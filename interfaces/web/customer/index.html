<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>元理 AI 战略咨询</title>
<style>
:root {
  --primary: #2563eb; --primary-glow: rgba(37,99,235,.10);
  --secondary: #059669; --warning: #d97706;
  --bg-app: #f6f7fb; --bg-card: #ffffff; --bg-soft: #f9fafb;
  --border: #e5e7eb; --text-main: #111827; --text-dim: #6b7280; --text-muted: #9ca3af;
  --shadow: 0 1px 2px rgba(15,23,42,.04), 0 12px 32px rgba(15,23,42,.05);
  --font: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg-app); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }

header { background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg,#2563eb,#059669); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
.brand b { font-size: 15px; display: block; }
.brand small { color: var(--text-dim); font-size: 12px; }
#stage-badge { margin-left: auto; font-size: 12px; padding: 5px 12px; border-radius: 999px; background: var(--primary-glow); color: var(--primary); font-weight: 600; }

main { flex: 1; display: flex; min-height: 0; }
#chat { flex: 1; overflow-y: auto; padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; }

/* 欢迎态 */
#welcome { margin: auto; max-width: 640px; text-align: center; padding: 24px; }
#welcome h1 { font-size: 26px; margin-bottom: 10px; letter-spacing: .5px; }
#welcome h1 span { color: var(--primary); }
#welcome p { color: var(--text-dim); font-size: 14px; line-height: 1.8; margin-bottom: 22px; }
#welcome .cards { display: flex; gap: 12px; justify-content: center; margin-bottom: 26px; flex-wrap: wrap; }
#welcome .cards div { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 18px; font-size: 13px; color: var(--text-dim); box-shadow: var(--shadow); }
#welcome .cards b { display: block; color: var(--text-main); font-size: 14px; margin-bottom: 3px; }

/* 消息 */
.msg { max-width: 76%; display: flex; flex-direction: column; }
.msg .meta { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.msg .body { padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.7; white-space: normal; word-break: break-word; }
.msg.customer { align-self: flex-end; align-items: flex-end; }
.msg.customer .body { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
.msg.consultant { align-self: flex-start; }
.msg.consultant .body { background: var(--bg-card); border: 1px solid var(--border); border-bottom-left-radius: 4px; box-shadow: var(--shadow); }
.msg.consultant.system .body { background: var(--bg-soft); color: var(--text-dim); font-size: 13px; }
.body b { font-weight: 650; }
.body ul, .body ol { margin: 6px 0 6px 20px; }
.body li { margin: 3px 0; }
.body h3 { font-size: 14px; margin: 10px 0 4px; }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 4px; animation: blink 1.2s infinite; }
.dot:nth-child(2){ animation-delay:.2s } .dot:nth-child(3){ animation-delay:.4s }
@keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }

/* 进展侧栏 */
#side { width: 280px; border-left: 1px solid var(--border); background: var(--bg-card); padding: 20px 18px; overflow-y: auto; display: none; }
#side h4 { font-size: 12px; color: var(--text-muted); letter-spacing: 1px; margin: 18px 0 10px; }
#side h4:first-child { margin-top: 0; }
.member { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; font-size: 13px; }
.member:hover { background: var(--bg-soft); }
.avatar { width: 28px; height: 28px; border-radius: 8px; background: var(--primary-glow); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex: none; }
.avatar.pm { background: rgba(5,150,105,.12); color: var(--secondary); }
.member .tag { margin-left: auto; font-size: 10px; color: var(--secondary); background: rgba(5,150,105,.1); padding: 2px 7px; border-radius: 999px; }
.todo { font-size: 13px; padding: 8px 10px; border-radius: 8px; display: flex; gap: 8px; align-items: flex-start; }
.todo:hover { background: var(--bg-soft); }
.todo .st { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--border); margin-top: 2px; }
.todo.open .st { border-color: var(--warning); }
.todo.in_progress .st { border-color: var(--primary); background: var(--primary-glow); animation: pulse 1.6s infinite; }
.todo.done .st { border-color: var(--secondary); background: var(--secondary); position: relative; }
.todo.done .st::after { content: '✓'; color: #fff; font-size: 10px; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.todo.done { color: var(--text-muted); text-decoration: line-through; }
.todo small { display: block; color: var(--text-muted); font-size: 11px; margin-top: 2px; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.25)} 50%{box-shadow:0 0 0 5px rgba(37,99,235,0)} }

footer { background: #fff; border-top: 1px solid var(--border); padding: 14px 20px; display: flex; gap: 10px; align-items: flex-end; }
#name { width: 120px; }
textarea { flex: 1; resize: none; height: 46px; max-height: 120px; font-family: var(--font); }
input, textarea { font-size: 14px; font-family: var(--font); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; outline: none; transition: border .15s; }
input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
button { background: var(--primary); color: #fff; border: none; cursor: pointer; padding: 12px 22px; border-radius: 10px; font-size: 14px; font-weight: 600; transition: all .15s; }
button:hover { filter: brightness(1.08); }
button:disabled { background: var(--text-muted); cursor: default; }
@media (max-width: 860px) { #side { display: none !important; } }
</style>
</head>
<body>
<header>
  <div class="logo">YL</div>
  <div class="brand"><b>元理 AI 战略咨询</b><small>合伙人受理 · 团队协作 · 质控把关</small></div>
  <div id="stage-badge" style="display:none"></div>
</header>
<main>
  <div id="chat">
    <div id="welcome">
      <h1>一句话，启动一支<span>咨询团队</span></h1>
      <p>告诉我们您的企业和想解决的问题。系统将自动组建团队（合伙人 + 行业研究员 + 企业研究员 + 质控审查员），完成研究、质控与结论汇报——全程在右侧可见。</p>
      <div class="cards">
        <div><b>🔍 双线研究</b>行业趋势 × 企业经营</div>
        <div><b>✅ 独立质控</b>事实与结论逐项把关</div>
        <div><b>📋 结论汇报</b>判断·依据·优先级</div>
      </div>
    </div>
  </div>
  <aside id="side">
    <h4>项目团队</h4><div id="team"></div>
    <h4>任务进展</h4><div id="todos"></div>
  </aside>
</main>
<footer>
  <input id="name" placeholder="您的称呼">
  <textarea id="text" placeholder="例：我们是做××的，年营收××，想知道××。"></textarea>
  <button id="send">发 送</button>
</footer>
<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), nameEl = $('name'), textEl = $('text'), sendBtn = $('send');
let customerId = localStorage.getItem('yl_customer_id') || '';
let signature = '';

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(t){
  let h = esc(t);
  h = h.replace(/^###?\s*(.+)$/gm,'<h3>$1</h3>');
  h = h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  h = h.replace(/^\s*[-•]\s+(.+)$/gm,'<li>$1</li>');
  h = h.replace(/^\s*\d+[.、]\s+(.+)$/gm,'<li>$1</li>');
  h = h.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, m => '<ul>'+m+'</ul>');
  h = h.split(/\n{2,}/).map(p => /^<(h3|ul|li)/.test(p.trim()) ? p : '<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
  return h;
}
function bubble(m){
  const w = document.createElement('div');
  w.className = 'msg ' + (m.from === 'customer' ? 'customer' : 'consultant');
  const meta = document.createElement('div'); meta.className = 'meta';
  meta.textContent = m.sender_name || (m.from === 'customer' ? '我' : '咨询合伙人');
  const body = document.createElement('div'); body.className = 'body';
  body.innerHTML = m.from === 'customer' ? esc(m.text).replace(/\n/g,'<br>') : md(m.text);
  w.append(meta, body); chat.appendChild(w);
}
function typing(){
  const w = document.createElement('div'); w.className = 'msg consultant';
  w.id = 'typing';
  w.innerHTML = '<div class="meta">咨询团队</div><div class="body" style="color:#6b7280"><span class="dot"></span><span class="dot"></span><span class="dot"></span> 团队工作中</div>';
  chat.appendChild(w); chat.scrollTop = chat.scrollHeight;
}
function renderSide(d){
  if (!d.team) return;
  $('side').style.display = 'block';
  const badge = $('stage-badge'); badge.style.display = 'inline-block'; badge.textContent = d.stage || '';
  $('team').innerHTML = d.team.map(t =>
    `<div class="member"><div class="avatar ${t.is_pm?'pm':''}">${(t.role||'?')[0]}</div>${t.role}${t.is_pm?'<span class="tag">PM</span>':''}</div>`).join('');
  $('todos').innerHTML = (d.todos||[]).map(t =>
    `<div class="todo ${t.status}"><div class="st"></div><div>${t.title}<small>${t.assignee||''}</small></div></div>`).join('');
}
async function poll(){
  if (!customerId) return;
  try {
    const r = await fetch(`/api/customer/sessions/${customerId}/messages`);
    if (!r.ok) return;
    const d = await r.json();
    const sig = JSON.stringify([d.messages, d.todos, d.stage]);
    if (sig !== signature) {
      signature = sig;
      chat.innerHTML = '';
      if (!d.messages.length) chat.innerHTML = '';
      d.messages.forEach(bubble);
      const waiting = d.messages.length && d.messages[d.messages.length-1].from === 'customer';
      if (waiting && d.stage !== '已完成') typing();
      chat.scrollTop = chat.scrollHeight;
      renderSide(d);
    }
  } catch(e) {}
}
sendBtn.onclick = async () => {
  const text = textEl.value.trim(); if (!text) return;
  const customer_name = nameEl.value.trim() || '客户';
  if (!customerId) chat.innerHTML = '';
  bubble({from:'customer', sender_name: customer_name, text});
  typing();
  sendBtn.disabled = true;
  try {
    const r = await fetch('/api/customer/sessions', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({customer_name, text, customer_id: customerId, template:'ai_strategy'}),
    });
    const d = await r.json();
    if (d.ok){ customerId = d.customer_id; localStorage.setItem('yl_customer_id', customerId); }
    else { chat.lastChild && chat.lastChild.remove(); bubble({from:'consultant', sender_name:'系统', text:'发送失败：'+(d.error||'未知错误')}); }
  } catch(e){ bubble({from:'consultant', sender_name:'系统', text:'网络错误，请重试'}); }
  textEl.value=''; sendBtn.disabled = false; poll();
};
textEl.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendBtn.click(); } });
setInterval(poll, 5000);
if (customerId) poll();
</script>
</body>
</html>
