# 回测框架配置文件

[trading]
# 交易规则
stop_loss = 0.08      # 止损比例
take_profit = 0.20    # 止盈比例
max_position = 0.50   # 最大仓位
slippage = 0.001      # 滑点
commission = 0.0003   # 佣金

[account]
# 账户设置
initial_capital = 100000  # 初始资金

[data]
# 数据设置
cache_ttl = 3600      # 缓存有效期(秒)

[strategy]
# 策略参数
min_continuous = 1    # 最小连板数
max_break_count = 0   # 最大炸板次数
limit_before_hour = 10  # 封板截止时间

[output]
# 输出设置
log_dir = ~/.backtest_logs
report_dir = ~/.backtest_reports
