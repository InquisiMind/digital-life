api_server:
  port: 8642
lifecycle:
  tick_interval: 60
budget:
  daily_limit: 50000000
  hourly_limit: 50000000
vitals:
  energy_recovery_per_hour: 100
  cost_per_ktoken_input: 0.005
  cost_per_ktoken_output: 0.05
  initiative_energy_threshold: 50
  initiative_idle_hours: 2.0
events:
  packages_dir: event-packages
workspace:
  mode: shallow
  root_template: ~/Documents/探索项目/工作区/{instance_name}
  unregistered_fallback: warn_repo_root
model:
  provider: glm
  base_url: https://open.bigmodel.cn/api/coding/paas/v4
  name: glm-5.3
  vision: glm-5.3-flash
  # 产品三档 → 厂商 reasoning_effort 值由 provider 家族声明（GLM low/high/xhigh）。
  # 网关值域不同（newapi 只认 low/high/max）时在机器层 local.yaml 覆盖单档：
  #   reasoning_depth_map: {deep: max}
agent:
  # 思考深度是"人"的基本配置：quick 快答 / standard 标准 / deep 深思。
  # 这里是未声明者的兜底；每个人在自己的 apps/<id>/config/app.yaml 覆盖，
  # 控制台「任务策略」与服务台 def 详情都可改。每次模型调用就按这个档，
  # 运行时没有快答/升档/卡住兜底等场景规则（2026-10-20 定稿）。
  reasoning_depth: standard
