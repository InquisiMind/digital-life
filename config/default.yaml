api_server:
  port: 8642
lifecycle:
  tick_interval: 60
budget:
  daily_limit: 50000000
  hourly_limit: 50000000
vitals:
  energy_recovery_per_hour: 100
  cost_per_ktoken_input: 0.005
  cost_per_ktoken_output: 0.05
  initiative_energy_threshold: 50
  initiative_idle_hours: 2.0
events:
  packages_dir: event-packages
workspace:
  mode: shallow
  root_template: ~/Documents/探索项目/工作区/{instance_name}
  unregistered_fallback: warn_repo_root
model:
  provider: glm
  base_url: https://open.bigmodel.cn/api/coding/paas/v4
  name: glm-5.3-flash
  vision: glm-5.3-flash
