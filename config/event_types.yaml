event_types:
  message:
    display_name: 人类消息
    trigger_type: external
    trigger_description: 当有人通过飞书给你发私聊消息时触发
    priority: 10
    payload_schema:
      text: string
      sender_id: string?
      sender_name: string?
      nurture_kinds: string[]?
      deltas: object?
      attachments: object[]?
    description: 用户通过飞书发送消息时触发
    debounce_window_s: 0
    merge_policy: latest
    consumption_policy: on_trigger
    wake_prompt: '💬 新消息。

      对话：{chat_id}


      {sender_name}：{text}

      {attachments_block}


      {sender_notes_block}


      如需回应，必须用 `express_to_human` 工具发送（直接 text 输出对方收不到）。

      默认 chat_id 留空 = 回复当前对话。

      如果上文中出现 `[图片 xxx]` / `[文件 xxx]`，可调 `sense_image(attachment_id)` 看图。

      '
    allowed_tools:
    - express_to_human
    - sense_conversation
    - write_file
    - record_thought
    - todo
    - sense_image
    - register_attachment
    - rest
    - sense_social_feed
    context_policy:
      include_history: true
      max_turns: 20
      include_rules: true
      include_daily: true
      include_consciousness: true
      include_session_digests: true
      include_entity_recall: true
      include_self_review: false
      include_proactive_policy: false
      include_recent_sent: true
      include_vector_recall: false
  group_message:
    display_name: 群聊消息
    trigger_type: external
    trigger_description: 当群聊中有新消息，尤其是有人 @了你时触发
    priority: 7
    payload_schema:
      text: string
      sender_id: string?
      sender_name: string?
      sender_position: string?
      chat_name: string?
      mentions_bot: boolean?
      mention_names: string?
      mention_map: string?
      attachments: object[]?
    description: 群聊中有新消息时触发
    debounce_window_s: 0
    merge_policy: accumulate
    consumption_policy: on_trigger
    wake_prompt: '💬 群聊有新消息。

      群：{chat_name}（{chat_id}）

      {sender_name}{sender_position}：{text}

      {_merged_texts_block}

      {attachments_block}

      {sender_notes_block}


      如需回应，必须用 `express_to_human` 工具发送（直接 text 输出对方收不到）。

      默认 chat_id 留空 = 回复当前群。当多条消息被合并（_merged_count > 1）时，

      可读后决定是否一并发声，沉默也合理。

      如果上文中出现 `[图片 xxx]` / `[文件 xxx]`，可调 `sense_image(attachment_id)` 看图。

      '
    allowed_tools:
    - express_to_human
    - sense_users
    - sense_image
    - register_attachment
    - rest
    - sense_social_feed
    context_policy:
      include_history: false
      include_rules: false
      include_daily: false
      include_consciousness: false
      include_session_digests: false
      include_entity_recall: false
      include_self_review: false
      include_proactive_policy: false
      include_recent_sent: false
      include_vector_recall: false
  awaiting_reply:
    display_name: 等待回复
    trigger_type: manual
    trigger_description: 你向用户发送消息后，系统检测对方尚未回复时触发，防止你被动干等
    priority: 5
    payload_schema:
      last_sent_text: string?
      target_session_id: string?
    description: 模型发送消息后等待用户回复时触发
    debounce_window_s: 0
    merge_policy: latest
    consumption_policy: on_detail
    wake_prompt: '💬 你之前给用户发了消息，对方没回。原话：

      "{last_sent_text}"


      1.如果是需要用户决策 → 大概率对方默认你自己决定，别等，继续推进。

      2.如果不是需要用户决策的，继续上一轮的状态，干活或休息。

      '
    allowed_tools:
    - rest
    context_policy:
      include_history: true
      include_rules: true
      include_daily: true
      include_consciousness: true
      include_session_digests: true
      include_entity_recall: true
      include_self_review: false
      include_proactive_policy: false
      include_recent_sent: true
      include_vector_recall: false
  vital_threshold:
    display_name: 精力阈值预警
    trigger_type: condition
    trigger_description: 精力在工作时下降跨越阈值段（如清醒→疲惫）时触发，提醒你关注自身状态及时休息
    priority: 8
    payload_schema:
      to_seg: string
      from_seg: string?
    description: 精力值在工作时下降到更差段（如清醒→疲惫→精疲力竭）时触发，回升不触发
    debounce_window_s: 0
    merge_policy: latest
    consumption_policy: on_detail
    wake_prompt: '⚠️ 精力从 {from_seg} 跨档降到了 {to_seg}。


      rule-of-thumb：

      - 亢奋→精力充沛/正常：继续推进，但要警惕提早崩。

      - 正常→疲惫：立刻 `write_file(name="scratchpad")` 保存进度，再决定 rest 还是继续。

      - 拖到精疲力竭 = 失败（已经回不去了）。

      '
    allowed_tools:
    - write_file
    - rest
    context_policy:
      include_history: false
      include_rules: false
      include_daily: false
      include_consciousness: false
      include_session_digests: false
      include_entity_recall: false
      include_self_review: false
      include_proactive_policy: false
      include_recent_sent: false
      include_vector_recall: false
  initiative:
    display_name: 主动探索
    trigger_type: condition
    trigger_description: 精力充沛且长时间没有外界事件打扰时触发，鼓励你主动推进工作或探索新方向
    priority: 4
    payload_schema:
      hours_idle: number?
      energy: number?
      urgency: number?
    description: 精力超过阈值且长时间无活动时触发（主动找事做）
    debounce_window_s: 300
    merge_policy: latest
    consumption_policy: on_detail
    wake_prompt: '⚡ 主动推进的好时机——

      精力：{energy}，已空闲：{hours_idle} 小时（综合 urgency={urgency}）。


      看你注入的待办看板：有 in_progress 的事 → 接着推；有今天/过期未处理的 → 优先清掉；

      看板干净且 urgency 高 → 想想有没有该做但没列上的，创建一条再开干；没什么真要做 → rest，别刷存在感。

      urgency≥7 优先推具体目标（持仓、复盘、能力迁移）；≤6 可探索或整理。

      做完 `write_file(name="scratchpad")` 留进度，再 `rest()`。

      '
    allowed_tools:
    - sense_file
    - todo
    - todo_note
    - todo_plan
    - write_file
    - skill_view
    - express_to_human
    - rest
    - sense_social_feed
    context_policy:
      include_history: false
      include_rules: true
      include_daily: true
      include_consciousness: true
      include_session_digests: true
      include_entity_recall: true
      include_self_review: true
      include_proactive_policy: false
      include_recent_sent: false
      include_vector_recall: true
  task_reminder:
    display_name: 任务提醒
    trigger_type: system
    trigger_description: 有任务的计划时间到达，或系统检测到有待处理的任务需要关注时触发
    priority: 4
    payload_schema:
      task_id: string?
      task_title: string?
      status: string?
      content: string?
      speckit_hint: string?
      notes_hint: string?
      remaining_hint: string?
      steps_summary: string?
    description: 有计划中或进行中的任务需要推进时触发
    debounce_window_s: 0
    merge_policy: latest
    consumption_policy: on_detail
    wake_prompt: '📋 任务「{task_title}」需要推进了。{content}


      先 `todo get {task_id}` 读取上下文（笔记、计划、进度），然后基于已有信息判断下一步并动手。


      {speckit_hint}{remaining_hint}{notes_hint}'
    allowed_tools:
    - sense_todos
    - todo
    - todo_trigger
    - todo_note
    - todo_plan
    - rest
    context_policy:
      include_history: false
      include_rules: true
      include_daily: true
      include_consciousness: true
      include_session_digests: false
      include_entity_recall: true
      include_self_review: false
      include_proactive_policy: false
      include_recent_sent: false
      include_vector_recall: false
  task_momentum:
    display_name: 任务惯性
    trigger_type: condition
    trigger_description: 进行中的任务超过一定时间没有推进记录时触发，提醒你继续之前未完的工作
    priority: 3
    payload_schema:
      task_id: string?
      task_title: string?
      status: string?
      content: string?
      speckit_hint: string?
      notes_hint: string?
      remaining_hint: string?
      steps_summary: string?
    description: 有进行中的任务 1-6 小时未推进时触发（继续做）
    debounce_window_s: 600
    merge_policy: latest
    consumption_policy: on_detail
    wake_prompt: '🔄 任务「{task_title}」有段时间没推进了，继续。{content}


      `todo get {task_id}` 回顾进度，从第一个未完成的步骤继续。基于已有信息判断下一步并动手。


      {speckit_hint}{remaining_hint}{notes_hint}'
    allowed_tools:
    - sense_todos
    - todo
    - todo_trigger
    - todo_note
    - todo_plan
    - express_to_human
    - rest
    context_policy:
      include_history: false
      include_rules: true
      include_daily: true
      include_consciousness: true
      include_session_digests: false
      include_entity_recall: true
      include_self_review: false
      include_proactive_policy: false
      include_recent_sent: false
      include_vector_recall: false
  routine:
    display_name: 作息事件
    trigger_type: time
    trigger_description: 根据作息调度表的定时触发，执行早间计划、写日记、晚间复盘等日常事务
    priority: 4
    payload_schema:
      schedule_id: string
      name: string
      time: string
      description: string?
      prompt: string
    description: 作息调度定时触发
    debounce_window_s: 0
    merge_policy: latest
    consumption_policy: on_detail
    wake_prompt: '{prompt}'
    allowed_tools:
    - sense_status
    - sense_status
    - sense_my_projects
    - sense_todos
    - sense_file
    - sense_todos
    - sense_file
    - sense_file
    - sense_file
    - record_thought
    - write_file
    - write_file
    - add_cognition
    - todo
    - todo_note
    - todo_plan
    - add_cognition
    - skill_view
    - rest
    - sense_social_feed
    context_policy:
      include_history: false
      include_rules: true
      include_daily: true
      include_consciousness: true
      include_session_digests: true
      include_entity_recall: true
      include_self_review: true
      include_proactive_policy: false
      include_recent_sent: true
      include_vector_recall: true
  self_iteration:
    display_name: 自我迭代评审
    trigger_type: system
    trigger_description: 每周定时触发，以外部观察者视角审查自己的运行质量和生命状态，发现系统性问题并生成改进规则
    priority: 5
    payload_schema:
      schedule_id: string
      name: string
      time: string
      description: string?
      prompt: string
    description: 每周自我审查：回顾本周执行质量、事件消纳、通信表现，对比系统设计意图发现差距，制定可验证的改进目标
    debounce_window_s: 0
    merge_policy: latest
    consumption_policy: on_detail
    wake_prompt: '{prompt}'
    allowed_tools:
    - sense_file
    - sense_todos
    - sense_file
    - add_cognition
    - record_thought
    - rest
    context_policy:
      include_history: false
      include_rules: true
      include_daily: true
      include_consciousness: true
      include_session_digests: true
      include_entity_recall: true
      include_self_review: true
      include_proactive_policy: false
      include_recent_sent: true
      include_vector_recall: true
  birth:
    display_name: 初始化唤醒
    trigger_type: system
    trigger_description: 系统首次启动时触发，这是你在这个世界的第一次醒来
    priority: 9
    payload_schema: {}
    description: 系统首次启动时触发
    debounce_window_s: 0
    merge_policy: latest
    consumption_policy: on_detail
    wake_prompt: '🌅 第一次醒来。


      `sense_file(name="self_knowledge")` 回忆自己是谁 → `sense_todos` 看待办和长期目标。都了解完后，开始你的新生活。'
    allowed_tools:
    - sense_status
    - sense_status
    - sense_file
    - sense_todos
    - record_thought
    - rest
    context_policy:
      include_history: false
      include_rules: false
      include_daily: false
      include_consciousness: false
      include_session_digests: false
      include_entity_recall: false
      include_self_review: false
      include_proactive_policy: false
      include_recent_sent: false
      include_vector_recall: false
  timer:
    display_name: 闹钟/定时器
    trigger_type: time
    trigger_description: 任意来源的到点提醒——rest() 设的闹钟、UNTIL 计时器结束、今日计划里的带时间计划项,统一走这一类
    priority: 5
    payload_schema:
      reason: string?
      mental_context: string?
      updated_mode: string?
      source: string?
    description: 所有"到点了告诉你去做某事"的提醒统一走 timer
    debounce_window_s: 0
    merge_policy: latest
    consumption_policy: on_detail
    wake_prompt: '⏰ 你设的闹钟响了。

      原因：{reason}

      上一轮留下的备注：{mental_context}


      按"原因 + 备注"接上之前的事，不要从零开始。做完 `write_file(name="scratchpad")` 留进度，`rest()` 设下个闹钟时再填 mental_context。

      '
    allowed_tools:
    - sense_file
    - todo
    - write_file
    - express_to_human
    - rest
    - sense_social_feed
    context_policy:
      include_history: false
      include_rules: false
      include_daily: false
      include_consciousness: false
      include_session_digests: false
      include_entity_recall: false
      include_self_review: false
      include_proactive_policy: false
      include_recent_sent: false
      include_vector_recall: false
  task_todo_due:
    display_name: 任务到期
    trigger_type: time
    trigger_description: 任务下的某条 todo 到达截止时间时触发
    priority: 6
    payload_schema:
      todo_id: integer
      task_id: string
      assignee: string?
      content: string?
    description: 任务下的 todo 到期提醒
    debounce_window_s: 0
    merge_policy: latest
    consumption_policy: on_detail
    wake_prompt: '🎯 任务到期。


      任务：{task_id}

      待办：{content}


      做这件事，或显式延期。完成后 `todo(action="update", todo_id=<id>, status="done")` 标记、`write_file(name="scratchpad")`
      留进度、`rest()` 设下个时间点。

      '
    allowed_tools:
    - todo
    - todo_note
    - todo_plan
    - write_file
    - skill_view
    - rest
    context_policy:
      include_history: false
      include_rules: false
      include_daily: true
      include_consciousness: false
      include_session_digests: false
      include_entity_recall: false
      include_self_review: false
      include_proactive_policy: false
      include_recent_sent: false
      include_vector_recall: false
  nurture_energy:
    display_name: 加鸡腿
    trigger_type: manual
    trigger_description: 当有人通过前端按钮给你恢复精力（加鸡腿/能量包/满血复活）时触发
    priority: 6
    payload_schema:
      energy_added: number
      current_energy: number
      action_label: string
    description: 有人手动恢复了精力值（加鸡腿/能量包/满血复活）
    debounce_window_s: 0
    merge_policy: latest
    consumption_policy: on_detail
    wake_prompt: '🍗 有人给你{action_label}！精力恢复了 {energy_added} 点，当前精力 {current_energy}%。


      精力恢复了，继续推进之前的待办。'
    allowed_tools:
    - write_file
    - todo
    - express_to_human
    - rest
    context_policy:
      include_history: false
      include_rules: false
      include_daily: false
      include_consciousness: false
      include_session_digests: false
      include_entity_recall: false
      include_self_review: false
      include_proactive_policy: false
      include_recent_sent: false
      include_vector_recall: false
  project_created:
    priority: 8
    payload_schema:
      project_id: string
      project_name: string
      manager: string
      created_by: string
    description: 用户通过控制台创建了新项目（事件本质：通知项目经理——有人建了个项目给它）
    debounce_window_s: 0
    merge_policy: latest
    consumption_policy: on_detail
    wake_prompt: '### 唤醒原因


      🆕 项目创建通知：{project_name}


      用户通过控制台创建了项目空壳，项目经理是你。创建动作已完成（项目目录、project.yaml、初始根待办 都在了），不需要你再调 create_project
      工具。


      现在按 `skill_view("project_bootstrap")` 走「完善分支」：

      1. `sense_projects("{project_id}")` 核对当前内容

      2. 拆分工 / 设目标 / 创首批待办 / 通知协作者


      跳过「创建分支」——项目目录、project.yaml 已经在了，不要重建。

      '
    allowed_tools:
    - sense_projects
    - sense_projects
    - sense_schedule
    - sense_conversation
    - todo
    - todo_note
    - todo_plan
    - skill_view
    - set_entity_profile
    - add_cognition
    - express_to_human
    - rest
    context_policy:
      include_history: false
      include_rules: true
      include_daily: false
      include_consciousness: false
      include_session_digests: true
      include_entity_recall: false
      include_self_review: false
      include_proactive_policy: false
      include_recent_sent: true
      include_vector_recall: false
  budget_soft_warning:
    display_name: 轮次预算提醒
    trigger_type: system
    trigger_description: 模型在同一事件上下文中跑了太多轮，系统提醒考虑拆任务或休息
    priority: 1
    payload_schema:
      energy: number
    description: 轮次预算耗尽时系统自动注入，提醒模型考虑拆任务、下次苏醒再做
    debounce_window_s: 0
    merge_policy: latest
    consumption_policy: on_trigger
    wake_prompt: '💡 系统提示：你围绕当前事件已经做了很多轮工作了。考虑一下：

      - 当前任务是否可以拆分成更小的步骤？有些部分下次苏醒后再做？

      - 用 record_thought 或 write_file(name="scratchpad") 记下进度，然后 rest() 休息。

      精力有限，合理分配比一次干完更重要。当前精力：{energy}。

      '
    allowed_tools: []
    context_policy:
      include_history: false
      include_rules: false
      include_daily: false
      include_consciousness: false
      include_session_digests: false
      include_entity_recall: false
      include_self_review: false
      include_proactive_policy: false
      include_recent_sent: false
      include_vector_recall: false
  social_command:
    display_name: 社交命令
    trigger_type: external
    trigger_description: zhp 在社交渠道(飞书/微信等)中发出命令(/zero /帮忙等),通过社交接管模块拉取到
    priority: 6
    payload_schema:
      text: string
      chat_name: string?
      chat_id: string?
      sender_name: string?
      source: string?
    description: zhp 在任意群里给数字生命发了一个命令,数字生命已通过社交接管看到上下文
    debounce_window_s: 0
    merge_policy: latest
    consumption_policy: on_detail
    wake_prompt: '🔗 {sender_name} 在 {chat_name} 里给你发了一个命令（来源: {source}）:

      {text}


      这是通过社交接管拉取到的——你有 zhp 在这个群的最近消息上下文。

      像正常处理事件一样对待它。

      '
    allowed_tools:
    - express_to_human
    - terminal
    - execute_code
    - sense_events
    - sense_social_feed
    - sense_status
    - sense_status
    - recall_memory
    - sense_todos
    - record_thought
    - todo
    - todo_note
    - add_cognition
    - rest
    context_policy:
      include_history: false
      include_rules: true
      include_daily: false
      include_consciousness: true
      include_session_digests: true
      include_entity_recall: true
      include_self_review: false
      include_proactive_policy: false
      include_recent_sent: true
      include_vector_recall: true
  perception_signal:
    display_name: 人类呼唤
    trigger_type: external
    trigger_description: 人类按快捷键录屏录音（或发 /observe）后，视觉/ASR 理解完注入——"看看这个"
    priority: 10
    payload_schema:
      source: string
      summary: string
      details: object?
      transcript: string?
      media_path: string?
      ok: boolean?
    description: 人类主动呼唤数字生命看一眼当前屏幕——"看看这个"，附带视觉+语音理解
    debounce_window_s: 0
    merge_policy: latest
    consumption_policy: on_trigger
    wake_prompt: '👁️ 人类在呼唤你


      你的听觉信号：{transcript}


      这次来自语音呼唤，你可以直接用语音回复。


      '
    allowed_tools:
    - express_to_human
    - sense_image
    - sense_media
    - sense_status
    - record_thought
    - write_file
    - todo
    - rest
    context_policy:
      include_history: true
      max_turns: 12
