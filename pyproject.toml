[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-life"
version = "0.1.0"
description = "L4 digital life system launcher"
requires-python = ">=3.11"

dependencies = [
    # HTTP / async IO
    "httpx>=0.27",
    "aiohttp>=3.10",
    "requests>=2.31",
    "certifi>=2024.0",
    # Config / data
    "PyYAML>=6.0",
    # Observability
    "prometheus_client>=0.20",
    # Feishu (Lark) ingress
    "lark-oapi>=1.4",
    # WeChat QR code (扫码登录 PNG 生成)
    "qrcode>=7.4",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Capability tier——例：图像识别、语音、量化。非核心运行可装。
capabilities = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "pyttsx3>=2.90",
    "SpeechRecognition>=3.10",
    # 感知/语音：快捷键触发录屏录音 + 视觉理解 + ASR 转写
    "sounddevice>=0.4",      # 麦克风采集
    # ⚠️ 钉死：pyobjc-framework-AVFoundation 12.x 在本机为坏包（import 报"不可用"，
    # force-reinstall 无效）；10.3.2 实测可用。混装 core 12.2.2 兼容。任何 pip 动作
    # 都可能把它拉回 12.x 静默回坏态——不要解开这个钉子。(9/15 zero 排雷 + alpha 落档)
    "pyobjc-framework-AVFoundation==10.3.2",  # TCC 麦克风权限请求（12.x 坏包勿升）
    "edge-tts>=6.1",         # 神经 TTS（云端，云希男声）
    # 实时语音会话 VAD：silero-vad 自带 ONNX 模型（data/silero_vad.onnx），
    # 我们直接用 onnxruntime 加载，避免拉 torch（沙箱无网/体积大）。
    "onnxruntime>=1.17",
    "silero-vad>=5.1",       # 仅取其打包的 ONNX 权重；运行时不 import 该包（它顶层 import torch）
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
digital-life = "interfaces.cli.cli:main"

[tool.setuptools.packages.find]
include = [
    "interfaces*",
    "application*",
    "domain*",
    "infrastructure*",
    "adapters*",
    "tools*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
