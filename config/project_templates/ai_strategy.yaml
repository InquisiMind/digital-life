initial_todos:
- title: S00 需求界定与材料分流
  detail: 主体消歧、决策情境、研究截止日、材料分层（materials/ext|int）、最小经营信息检查；产出 00-material-intake.md
    并向客户复述边界
  assign_role: 咨询合伙人
- title: S01 外部中立研究
  detail: Q1-Q10 行业地图与目标企业公开现状；EXT-F 事实条目+时效表；产出 01-external-neutral.md
  assign_role: 行业研究员
  after:
  - S00 需求界定与材料分流
- title: S02 内部经营研究
  detail: 基本盘+经营本质七维度+竞争性企业解释；INT-F 事实条目；产出 02-internal-facts.md
  assign_role: 企业研究员
  after:
  - S00 需求界定与材料分流
- title: S03 事实底稿与验收
  detail: 合并 EXT-F/INT-F 为 F-xxx 统一账本、时效验收、冲突登记、G-xxx 缺口；产出 03-fact-ledger.md
  assign_role: 事实审计员
  after:
  - S01 外部中立研究
  - S02 内部经营研究
- title: S04 战略判断与方向推荐
  detail: 候选记录+比较+推荐；向客户提出方向选项（H1）——客户完成选择后才置 done；产出 04-strategy-candidates.md 与
    strategy-record.json
  assign_role: 咨询合伙人
  kind: milestone
  after:
  - S03 事实底稿与验收
- title: S06 经营关系定义
  detail: 选定方向的价值网络：谁受益/行动/负责/付费与获益路径；产出 06-value-network.md
  assign_role: 方案设计师
  after:
  - S04 战略判断与方向推荐
- title: S07 工作方式设计
  detail: 流程、优先级、数字员工岗位与人机边界；产出 07-process-roles.md
  assign_role: 方案设计师
  after:
  - S06 经营关系定义
- title: S08 成败标准定义
  detail: 指标、基线、归因与继续/调整/停止条件；产出 08-pilot-validation.md
  assign_role: 方案设计师
  after:
  - S07 工作方式设计
- title: S09 独立质量审查
  detail: 证据与设计是否支撑建议：放行/条件放行/定向退回；产出 09-review.md 与 review-record.json
  assign_role: 质控审查员
  after:
  - S08 成败标准定义
- title: S10 战略叙事与定稿
  detail: S10a 组织故事→S10b 形成 10-final-report.md（deliver_to_shared 交付）并提请客户评审（H2）
  assign_role: 质控审查员
  kind: milestone
  after:
  - S09 独立质量审查
