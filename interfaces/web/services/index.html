<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服务台 · 元理</title>
<style>
:root{
  --bg:#ffffff; --bg-subtle:#f7f8fa; --bg-sunken:#f0f1f5; --rail:#fafafd;
  --bd:#ececf1; --bd-2:#dfe0e8;
  --tx:#1b1c22; --tx-2:#565a6b; --tx-3:#9095a6;
  --pri:#2f6bff; --pri-weak:#eef3ff; --pri-deep:#1d4fd8;
  --ok:#0e9f6e; --ok-weak:#e6f6ef; --warn:#c2790a; --warn-weak:#fdf3e2;
  --r-s:8px; --r-m:12px; --r-l:16px;
  --sh-1:0 1px 2px rgba(20,22,40,.05); --sh-2:0 10px 32px rgba(20,22,40,.10);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:var(--font)}
::selection{background:var(--pri-weak)}

/* ══ 三区骨架：rail 导航 + 列表 + 右侧整页详情 ══ */
.app{height:100vh;display:flex}
.rail{width:220px;flex:none;background:var(--rail);border-right:1px solid var(--bd);display:flex;flex-direction:column}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg-subtle)}
.rpage{position:absolute;inset:0;background:var(--bg);z-index:20;transform:translateX(100%);visibility:hidden;transition:transform .22s ease,visibility .22s;display:flex;flex-direction:column}
.rpage.open{transform:none;visibility:visible}

/* rail */
.rail-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.rail-brand .mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#4d7cff,#b078ec);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none}
.rail-brand b{font-size:14.5px}
.rail-brand small{display:block;font-size:11px;color:var(--tx-3);font-weight:400}
.nav{padding:6px 10px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-m);font-size:13.5px;font-weight:550;color:var(--tx-2);cursor:pointer;margin-bottom:2px;transition:all .12s}
.nav-item svg{width:16px;height:16px;color:var(--tx-3)}
.nav-item:hover{background:var(--bg-sunken);color:var(--tx)}
.nav-item.on{background:var(--pri-weak);color:var(--pri-deep)}
.nav-item.on svg{color:var(--pri)}
.nav-cap{font-size:11px;color:var(--tx-3);letter-spacing:1.5px;font-weight:600;padding:12px 22px 6px}
.rail-foot{border-top:1px solid var(--bd);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.foot-link{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-s);font-size:12.5px;color:var(--tx-2);cursor:pointer}
.foot-link:hover{background:var(--bg-sunken)}
.foot-link svg{width:15px;height:15px;color:var(--tx-3)}

/* 列表区 */
.mh{flex:none;height:58px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--bd);background:var(--bg)}
.mh h2{font-size:16px;font-weight:650}
.mh .sub{font-size:12px;color:var(--tx-3)}
.mh .spacer{margin-left:auto}
.btn{border:1px solid var(--bd-2);background:var(--bg);border-radius:9px;padding:7px 14px;font-size:12.5px;font-weight:550;cursor:pointer;color:var(--tx-2);transition:all .12s}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.pri:hover{background:var(--pri-deep);color:#fff}
.btn.danger{color:#c0353b;border-color:#e5b4b4}
.btn.danger:hover{border-color:#c0353b;background:#fdf3f3;color:#c0353b}
.list{flex:1;overflow-y:auto;padding:20px 24px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.rowcard{display:flex;flex-direction:column;gap:8px;padding:16px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r-l);cursor:pointer;transition:all .12s;box-shadow:var(--sh-1)}
.rowcard:hover{border-color:var(--pri);box-shadow:var(--sh-2);transform:translateY(-1px)}
.rowcard .top{display:flex;align-items:center;gap:10px}
.rowcard .ava{width:38px;height:38px;border-radius:11px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:650;flex:none}
.rowcard b{font-size:14px;font-weight:600;line-height:1.3}
.rowcard .meta{font-size:11.5px;color:var(--tx-3);line-height:1.5}
.rowcard .side{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--tx-3);flex-wrap:wrap}
.stat b{font-size:13px;color:var(--tx);font-weight:650;display:block;text-align:left}
.stat span{font-size:10.5px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
.b-green{background:var(--ok-weak);color:var(--ok)}
.b-gray{background:#f3f4f6;color:var(--tx-3)}
.b-blue{background:var(--pri-weak);color:var(--pri-deep)}
.b-amber{background:var(--warn-weak);color:var(--warn)}
.empty{text-align:center;color:var(--tx-3);padding:80px 0;font-size:13px}

/* 右侧整页详情 */
.rp-head{flex:none;min-height:58px;display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--bd)}
.rp-back{display:inline-flex;align-items:center;gap:4px;border:none;background:none;color:var(--pri);font-size:13px;font-weight:600;cursor:pointer;padding:7px 10px;border-radius:9px}
.rp-back:hover{background:var(--pri-weak)}
.rp-title{min-width:0;flex:1;display:flex;align-items:center}
.rp-title b{font-size:15px;font-weight:650}
.rp-title small{display:block;font-size:11.5px;color:var(--tx-3);margin-top:1px}
.rp-title .ops{display:flex;gap:8px;margin-left:auto;align-items:center}
.rp-body{flex:1;overflow-y:auto;padding:20px 24px 32px}
.rp-inner{max-width:860px;margin:0 auto}
.rp-body h6{font-size:11px;color:var(--tx-3);letter-spacing:1.5px;margin:14px 0 8px;font-weight:600}
.rp-body h6:first-child{margin-top:0}

/* tabs（详情页内） */
.cfg-tabs{display:flex;gap:2px;padding:3px;background:var(--bg-sunken);border-radius:11px;width:fit-content;margin-bottom:16px;flex-wrap:wrap}
.cfg-tabs button{border:none;background:transparent;padding:7px 16px;border-radius:9px;font-size:12.5px;font-weight:550;color:var(--tx-2);cursor:pointer}
.cfg-tabs button.on{background:var(--bg);color:var(--pri-deep);box-shadow:var(--sh-1);font-weight:650}

/* 通用表单/卡片（与客户页同套设计语言） */
.cfg-card{border:1px solid var(--bd);border-radius:var(--r-m);padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cfg-card b{font-size:13px}
.cfg-mono{font-family:ui-monospace,monospace;font-size:11px;color:var(--tx-3)}
.cfg-note{font-size:11.5px;color:var(--tx-3);line-height:1.6}
.cfg-in{font-size:13px;border:1px solid var(--bd-2);border-radius:var(--r-s);padding:7px 10px;font-family:var(--font);flex:1;min-width:0;background:var(--bg);color:var(--tx)}
.cfg-in:focus{outline:none;border-color:var(--pri)}
.cfg-area{width:100%;border:1px solid var(--bd-2);border-radius:var(--r-s);padding:9px 12px;font-family:var(--font);font-size:13px;line-height:1.7;background:var(--bg);color:var(--tx);resize:vertical}
.cfg-area:focus{outline:none;border-color:var(--pri)}
.mk-src{font-size:10.5px;padding:1px 7px;border-radius:5px;font-weight:600}
.src-overlay{background:#f1edff;color:#7a5cff}
.src-def{background:var(--pri-weak);color:var(--pri-deep)}
.src-system{background:var(--bg-sunken);color:var(--tx-3)}
.skill-row{border:1px solid var(--bd);border-radius:var(--r-m);margin-bottom:8px;overflow:hidden}
.skill-row .sr-h{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer}
.skill-row .sr-h:hover{background:var(--bg-subtle)}
.skill-row .sr-h b{font-size:13px}
.skill-row .sr-h .d{font-size:12px;color:var(--tx-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
/* 局部 hover 编辑块 */
.hoverbox{position:relative;border:1px solid var(--bd);border-radius:var(--r-m);padding:14px 16px}
.hoverbox .hedit{position:absolute;top:8px;right:8px;display:none;z-index:3}
.hoverbox:hover .hedit{display:inline-flex}
.hoverbox:hover{border-color:var(--bd-2)}
.mdbody{font-size:13.5px;line-height:1.8;word-break:break-word}
.mdbody p{margin:0 0 .7em}.mdbody p:last-child{margin:0}
.mdbody h1,.mdbody h2,.mdbody h3{font-size:14.5px;margin:1em 0 .4em;font-weight:650}
.mdbody ul{margin:.3em 0 .8em;padding-left:1.3em}.mdbody li{margin:.25em 0}
.mdbody b{font-weight:650}.mdbody code{background:var(--bg-sunken);border-radius:5px;padding:1px 6px;font-size:.92em}
.ava-big img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.ava img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.tool-row{border:1px solid var(--bd);border-radius:var(--r-m);margin-bottom:8px;overflow:hidden}
.tool-row .tr-h{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer}
.tool-row .tr-h:hover{background:var(--bg-subtle)}
.tool-row .tr-h b{font-size:13px;font-family:ui-monospace,monospace}
.tool-row .tr-h .ts{font-size:10.5px;padding:1px 7px;border-radius:5px;background:var(--bg-sunken);color:var(--tx-2)}
.tool-row .tr-b{display:none;border-top:1px solid var(--bd);padding:10px 12px;background:var(--bg-subtle)}
.tool-row.open .tr-b{display:block}
.tool-row pre{font-size:11.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:280px;overflow:auto;margin:0}

/* 抽屉（群沟通/交付物回放） */
#drawer{position:fixed;top:0;right:-460px;width:min(440px,94vw);height:100vh;background:var(--bg);box-shadow:-12px 0 40px rgba(15,23,42,.12);transition:right .2s;z-index:40;display:flex;flex-direction:column}
#drawer.open{right:0}
.dh{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.dh b{font-size:15px}.dh .x{cursor:pointer;color:var(--tx-3);font-size:16px;border:none;background:none}
.db{flex:1;overflow-y:auto;padding:16px 20px;font-size:13px}
.kv{display:flex;gap:8px;margin:4px 0;align-items:center}.kv i{width:88px;color:var(--tx-3);font-style:normal;font-size:12px;flex:none}
.msg{border-left:3px solid var(--pri);background:var(--bg-subtle);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:13px}
.msg .m{font-size:11px;color:var(--tx-3);margin-bottom:3px}
.file{cursor:pointer;padding:8px 12px;border-radius:8px;display:flex;gap:8px;align-items:center}
.file:hover{background:var(--pri-weak)}
.back{cursor:pointer;color:var(--pri);font-size:12px;margin-bottom:8px}
pre.doc{background:var(--bg-subtle);border:1px solid var(--bd);border-radius:10px;padding:14px;white-space:pre-wrap;font-size:12.5px;line-height:1.7;max-height:60vh;overflow:auto}
.wake{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--bg-subtle)}
.wake b{font-size:12px}.wake .m{color:var(--tx-3);font-size:11px;margin-top:3px}
@media(max-width:880px){
  .rail{width:64px}
  .rail-brand b,.rail-brand small,.nav-item span,.nav-cap,.foot-link span{display:none}
  .nav-item{justify-content:center;padding:11px 0}
}
</style>
</head>
<body>
<div class="app">
  <!-- 左：管理导航（对象模型三层：Agents=实例 / 模版·定义=定义层 / 项目=组织） -->
  <aside class="rail">
    <div class="rail-brand">
      <div class="mark">台</div>
      <div><b>元理服务台</b><small>管理台 · 内部</small></div>
    </div>
    <div class="nav-cap">配置管理</div>
    <div class="nav" id="nav">
      <div class="nav-item on" data-v="agents" title="Agent 类型配置（定义层，作用于同类型全部实例）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Agent 配置</span></div>
      <div class="nav-item" data-v="templates" title="项目模版配置（成员班子 / 预设任务骨架）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15l2 2 4-4"/></svg><span>项目模版</span></div>
    </div>
    <div class="rail-foot">
      <div class="foot-link" onclick="window.open('/customer','_blank')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>客户入口 ↗</span></div>
    </div>
  </aside>

  <!-- 中：列表 -->
  <div class="main">
    <header class="mh">
      <h2 id="mh-title">Agents</h2>
      <span class="sub" id="mh-sub"></span>
      <span class="spacer"></span>
      <span id="mh-ops"></span>
    </header>
    <div class="list" id="list"><div class="empty">加载中…</div></div>

    <!-- 右：整页详情 -->
    <div class="rpage" id="rpage">
      <header class="rp-head">
        <button class="rp-back" onclick="closeDetail()">‹ 返回</button>
        <div class="rp-title" id="rp-title"></div>
        <div class="ops" id="rp-ops"></div>
      </header>
      <div class="rp-body" id="rp-body"></div>
    </div>
  </div>
</div>
<div id="drawer"><div class="dh"><b id="d-title">详情</b><button class="x" onclick="closeDrawer()">✕</button></div><div class="db" id="d-body"></div></div>

<script src="/customer/vendor/marked.min.js"></script>
<script>if(window.marked){marked.setOptions({mangle:false,headerIds:false});}</script>
<script>
const $=id=>document.getElementById(id);
const MD=(window.marked?window.marked.parse:null);
function mdRender(t){const n=(t||'').replace(/(^|\n)\s*(\d+)[、.．]\s*/g,'$1$2. ');
 if(MD){try{return MD(n);}catch(e){}}return `<div style="white-space:pre-wrap">${esc(t||'')}</div>`;}
const esc=t=>(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const AVA=['#2f6bff','#0e9f6e','#c2790a','#7a5cff','#e0526d'];
const avc=n=>{let s=0;for(const c of(n||'x'))s+=c.charCodeAt(0);return AVA[s%AVA.length]};
async function jget(u){const r=await fetch(u);return r.json()}
function closeDrawer(){$('drawer').classList.remove('open')}
function openDrawer(title,html){$('d-title').textContent=title;$('d-body').innerHTML=html;$('drawer').classList.add('open')}
function closeDetail(){$('rpage').classList.remove('open')}

/* ══ 一级导航 ══ */
let VIEW='agents';
document.querySelectorAll('.nav-item').forEach(n=>n.onclick=()=>{
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('on',x===n));
  VIEW=n.dataset.v;closeDetail();renderList();});

let LISTSIG='';
async function renderList(){
  const list=$('list');
  $('mh-title').textContent={agents:'Agent 配置',templates:'项目模版'}[VIEW]||'';
  if(VIEW==='agents'){
    $('mh-sub').textContent='agent 类型（定义层）· 配置作用于同类型全部实例';
    $('mh-ops').innerHTML='<button class="btn pri" onclick="newAgent()">＋ 新建类型</button>';
    const [dd,sv]=await Promise.all([jget('/api/admin/defs'),jget('/api/admin/services')]);
    const svcs=sv.services||[];
    const sig='a'+JSON.stringify([dd.defs,svcs.map(x=>[x.agent_def_id,x.status,x.wakes])]);
    if(sig===LISTSIG&&list.dataset.view==='agents'&&list.innerHTML)return; // 数据未变不重绘
    LISTSIG=sig;list.dataset.view='agents';
    list.innerHTML=`<div class="cards">`+(dd.defs||[]).map(x=>{
      const mine=svcs.filter(v=>v.agent_def_id===x.def_id);
      const running=mine.filter(v=>v.status==='active');
      const wakes=running.reduce((a,v)=>a+(v.wakes||0),0);
      return `<div class="rowcard" onclick="defDetail('${esc(x.def_id)}')">
       <div class="top"><div class="ava" style="background:${avc(x.display_name)}">${esc((x.display_name||'?').slice(0,2))}</div>
        <div><b>${esc(x.display_name)}</b><div class="meta">${esc(x.def_id)}</div></div></div>
       <div class="side">
        <span>${mine.length} 实例 · ${running.length} 运行</span>${wakes?`<span>· ${wakes} 次唤醒</span>`:''}
       </div>
       <div class="meta">人设 · Skill · 工具 · 事件唤醒文案</div>
      </div>`;}).join('')+`</div>`||'<div class="empty">还没有 agent 类型——右上新建</div>';
  }else if(VIEW==='templates'){
    $('mh-sub').textContent='成员班子与任务编排 · 建项目时实例化';
    $('mh-ops').innerHTML='';
    const [d,pl]=await Promise.all([jget('/api/admin/templates'),jget('/api/admin/projects')]);
    const sig='t'+JSON.stringify([d.templates,pl.projects.map(p=>[p.template_id,p.status])]);
    if(sig===LISTSIG&&list.dataset.view==='templates'&&list.innerHTML)return;
    LISTSIG=sig;list.dataset.view='templates';
    list.innerHTML=`<div class="cards">`+d.templates.map(t=>{
      const n=(pl.projects||[]).filter(p=>p.template_id===t.id).length;
      return `<div class="rowcard" onclick="tplDetail('${esc(t.id)}')">
       <div class="top"><div class="ava" style="background:linear-gradient(135deg,#4d7cff,#b078ec)">模</div>
        <div><b>${esc(t.name)}</b><div class="meta">${esc(t.id)}.yaml</div></div></div>
       <div class="side"><span>已实例化 ${n} 个项目</span></div>
       <div class="meta">成员班子 · 任务编排（前置解锁）</div>
      </div>`;}).join('')+`</div>`||'<div class="empty">暂无模版</div>';
  }
}

/* ══ Agent 配置（对象=定义层，作用于同类型全部实例） ══ */
let AG={};
async function defDetail(defId){
  const [pf,tl,sv]=await Promise.all([
    jget('/api/admin/agent-defs/'+encodeURIComponent(defId)+'/profile'),
    jget('/api/admin/tools'),
    jget('/api/admin/services')]);
  AG={defId,profile:pf,tools:tl.tools||[],editWhat:null,evEdit:null,
      instances:(sv.services||[]).filter(x=>x.agent_def_id===defId),tab:'overview'};
  $('rp-title').innerHTML=`<b>${esc(pf.name||defId)}</b><small>${esc(defId)} · ${AG.instances.length} 运行实例 · 配置作用于全部实例</small>`;
  $('rp-ops').innerHTML=`<button class="btn danger" onclick="deleteDef()">删除类型</button>`;
  AG.tab='basic';AG.editing=false;
  $('rp-body').innerHTML=`<div class="cfg-tabs">
    <button data-t="basic" class="on" onclick="setAgentTab('basic')">基本信息</button>
    <button data-t="skill" onclick="setAgentTab('skill')">Skill</button>
    <button data-t="tool" onclick="setAgentTab('tool')">Tool · 默认工具面</button>
    <button data-t="events" onclick="setAgentTab('events')">事件 · 唤醒文案</button>
   </div><div id="ag-tab"></div>`;
  $('rpage').classList.add('open');
  renderAgentTab();
}
function setAgentTab(t){AG.tab=t;
  document.querySelectorAll('.cfg-tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  renderAgentTab();}
function renderAgentTab(){
  const el=$('ag-tab');if(!el)return;
  if(AG.tab==='basic'){
   const p=AG.profile;
   const avImg=p.avatar&&p.avatar.startsWith('api:');
   const avStyle=p.avatar&&!p.avatar.startsWith('#')&&!avImg?'linear-gradient(135deg,#4d7cff,#b078ec)':(avImg?'#dfe0e8':(p.avatar||avc(p.name)));
   const avTxt=avImg?'':(p.avatar&&!p.avatar.startsWith('#')?p.avatar:(p.name||'A').slice(0,2));
   if(!AG.editWhat){
    el.innerHTML=`
    <div class="hoverbox" style="display:flex;align-items:center;gap:14px;margin-bottom:8px">

/* Tool：类型默认工具面——默认显示已启用，可切换全部（含 registry 全量与服务运行时面） */
let TOOLVIEW={all:false};
async function loadDefTools(){
  const [dt,sv]=await Promise.all([
   jget(`/api/admin/agent-defs/${encodeURIComponent(AG.defId)}/tools`),
   jget('/api/admin/services')]);
  const explicit=Array.isArray(dt.tools)?dt.tools:null;
  // 该类型任一实例的显式面（来自模版）也并入清单（只读标注，编辑走模版）
  const svcTools=new Set();
  (sv.services||[]).filter(x=>x.agent_def_id===AG.defId)
   .forEach(x=>(x.tools||[]).forEach(t=>svcTools.add(t)));
  const regNames=new Set(AG.tools.map(t=>t.name));
  const enabled=new Set(explicit??AG.tools.map(t=>t.name));
  const rows=[...AG.tools];
  svcTools.forEach(n=>{if(!regNames.has(n))rows.push({name:n,toolset:'模版角色',description:'项目模版为角色显式配置的工具（在模版上调整）',schema:{name:n,parameters:{}}});});
  const el=$('tool-tab');if(!el)return;
  const shown=TOOLVIEW.all?rows:rows.filter(t=>enabled.has(t.name));
  el.innerHTML=`
  <div class="cfg-note" style="margin:0 0 10px">类型默认工具面：当前${explicit?'为显式清单':'未配置 = 默认全量'}。项目模版给角色显式配置的工具面以模版为准。点行展开 schema；自定义工具暂不支持。</div>
  <div style="margin-bottom:10px"><button class="btn" onclick="TOOLVIEW.all=!TOOLVIEW.all;loadDefTools()">${TOOLVIEW.all?'只看已启用':'查看全部（'+rows.length+'）'}</button></div>
  ${shown.map(t=>{const on=enabled.has(t.name);const fixed=t.name==='rest';return `<div class="tool-row">
   <div class="tr-h" onclick="this.parentElement.classList.toggle('open')">
    <input type="checkbox" data-tool="${esc(t.name)}" ${on?'checked':''} ${fixed?'disabled title="系统必需：agent 主动休息的机制工具"':'onclick="event.stopPropagation()"'}>
    <b>${esc(t.name)}</b>${fixed?'<span class="ts" style="background:#fdf3e2;color:#c27900">系统必需</span>':`<span class="ts">${esc(t.toolset)}</span>`}
    <span class="d" style="flex:1;font-size:12px;color:var(--tx-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.description)}</span>
   </div>
   <div class="tr-b"><pre>${esc(JSON.stringify(t.schema,null,2))}</pre></div>
  </div>`}).join('')||'<div class="cfg-note">无启用的工具</div>'}
  <div style="display:flex;gap:8px;margin-top:12px">
   <button class="btn pri" onclick="saveDefTools()">保存类型默认</button>
   ${explicit?'<button class="btn" onclick="clearDefTools()">清除默认（回全量）</button>':''}
  </div>`;
}
async function saveDefTools(){
  const tools=[...document.querySelectorAll('#tool-tab input[data-tool]')].filter(c=>c.checked).map(c=>c.dataset.tool);
  if(!tools.length&&!confirm('全部取消将默认禁用所有工具，确定？'))return;
  const r=await fetch(`/api/admin/agent-defs/${encodeURIComponent(AG.defId)}/tools`,{method:'PUT',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({tools})});
  const d=await r.json();
  if(d.ok)loadDefTools();else alert(d.error||'保存失败');
}
async function clearDefTools(){
  await fetch(`/api/admin/agent-defs/${encodeURIComponent(AG.defId)}/tools`,{method:'PUT',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({tools:null})});
  loadDefTools();
}

async function createAgentDef(){
  const name=$('na-name').value.trim();
  if(!name){alert('名称必填');return;}
  const r=await fetch('/api/admin/agent-defs',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({name,def_id:$('na-id').value.trim()||undefined})});
  const d=await r.json();
  if(d.ok){closeDrawer();renderList();defDetail(d.def_id);}
  else alert(d.error||'创建失败');
}

/* ══ 模版详情（结构化编辑 · 整页） ══ */
let TPL={mode:'form'};
async function tplDetail(tid){
  const [d,defs]=await Promise.all([jget('/api/admin/templates/'+tid),jget('/api/admin/defs')]);
  TPL={id:tid,p:d.parsed||{},defs:defs.defs||[],mode:'form',raw:d.raw};FLOW={sel:-1,drag:null,pos:{}};
  $('rp-title').innerHTML=`<b>模版 · ${esc((d.parsed&&d.parsed.name)||tid)}</b><small>定义层 · 角色班子与任务编排 · 建项目时生效</small>`;
  $('rp-ops').innerHTML=`<button class="btn" onclick="TPL.mode=TPL.mode==='form'?'raw':'form';renderTpl()">${TPL.mode==='form'?'源码模式':'表单模式'}</button>
   <button class="btn pri" onclick="tplSaveStructured()">保存</button>`;
  $('rp-body').innerHTML='<div class="rp-inner" id="tpl-body"></div>';
  $('rpage').classList.add('open');
  renderTpl();
}
function renderTpl(){
  const el=$('tpl-body');if(!el)return;
  const p=TPL.p;
  if(TPL.mode==='raw'){
   el.innerHTML=`<textarea id="tpl-raw" style="width:100%;min-height:60vh;font-family:ui-monospace,monospace;font-size:12px;line-height:1.7;border:1px solid var(--bd-2);border-radius:var(--r-s);padding:12px">${esc(TPL.raw||'')}</textarea>
   <div class="cfg-note" style="margin-top:8px">源码模式保存走 YAML 语法闸；表单模式保存会重排 YAML（丢注释）。</div>`;
   return;
  }
  const roleNames=(p.roles||[]).map(r=>r.name||r.def);
  el.innerHTML=`
   <h6>基本信息</h6>
   <div class="cfg-card"><span class="cfg-mono" style="flex:none">模版名</span><input class="cfg-in" id="t-name" value="${esc(p.name||'')}"></div>
   <div class="cfg-card"><span class="cfg-mono" style="flex:none">描述</span><input class="cfg-in" id="t-desc" value="${esc(p.description||'')}"></div>
   <div class="cfg-card"><span class="cfg-mono" style="flex:none">看门狗</span><label style="font-size:12.5px"><input type="checkbox" id="t-wd" ${p.watchdog?'checked':''}> 全员停摆时自动催 PM</label></div>
   <h6>项目成员（${(p.roles||[]).length}）· 引用 agent 类型——人设/工具面在类型上配置</h6>
   ${(p.roles||[]).map((r,i)=>`<div class="cfg-card" style="flex-wrap:wrap">
    <input value="${esc(r.def||'')}" list="def-list" placeholder="agent 类型" onchange="TPL.p.roles[${i}].def=this.value" style="font-size:12px;border:1px solid var(--bd-2);border-radius:7px;padding:6px 8px;width:190px;font-family:ui-monospace,monospace">
    <input value="${esc(r.name||'')}" placeholder="角色名" onchange="tplRoleRenamed(${i},this.value)" style="font-size:12.5px;border:1px solid var(--bd-2);border-radius:7px;padding:6px 8px;flex:1;min-width:110px">
    <label style="font-size:12px;white-space:nowrap"><input type="radio" name="t-pm" ${r.pm?'checked':''} onchange="tplSetPm(${i})"> PM</label>
    ${r.def?`<button class="btn" style="flex:none" onclick="defDetail('${esc(r.def)}')">类型配置 ↗</button>`:''}
    <button class="btn danger" style="flex:none" onclick="tplDelRole(${i})">删除</button>
   </div>`).join('')}
   <datalist id="def-list">${TPL.defs.map(d=>`<option value="${esc(d.def_id)}">${esc(d.display_name)}</option>`).join('')}</datalist>
   <button class="btn" onclick="tplAddRole()">＋ 增加成员</button>
   <h6>任务骨架与编排（${(p.initial_todos||[]).length}）· 勾选前置＝前置全部完成后自动解锁</h6>
   <div id="tpl-flow" style="margin-bottom:10px"></div>
   ${(p.initial_todos||[]).map((t,i)=>`<div class="cfg-card" style="flex-wrap:wrap">
    <input value="${esc(t.title||'')}" placeholder="任务标题" onchange="tplTitleChanged(${i},this.value)" style="font-size:12.5px;border:1px solid var(--bd-2);border-radius:7px;padding:6px 8px;flex:1;min-width:150px">
    <select onchange="TPL.p.initial_todos[${i}].kind=this.value==='milestone'?'milestone':undefined" style="font-size:12px;border:1px solid var(--bd-2);border-radius:7px;padding:6px">
     <option value="task" ${t.kind!=='milestone'?'selected':''}>任务</option>
     <option value="milestone" ${t.kind==='milestone'?'selected':''}>🚩 里程碑</option>
    </select>
    <select onchange="TPL.p.initial_todos[${i}].assign_role=this.value||undefined" style="font-size:12px;border:1px solid var(--bd-2);border-radius:7px;padding:6px;max-width:130px">
     <option value="">未指派</option>
     ${roleNames.map(n=>`<option value="${esc(n)}" ${t.assign_role===n?'selected':''}>${esc(n)}</option>`).join('')}
    </select>
    <button class="btn danger" style="flex:none" onclick="tplDelTodo(${i})">删除</button>
    <input value="${esc(t.detail||'')}" placeholder="任务描述（可选）" onchange="TPL.p.initial_todos[${i}].detail=this.value" style="font-size:12px;border:1px solid var(--bd-2);border-radius:7px;padding:5px 8px;width:100%;margin-top:6px">
    ${(()=>{const others=(p.initial_todos||[]).filter((_,j)=>j!==i);
      if(!others.length)return '';
      return `<div style="width:100%;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;padding-top:6px;border-top:1px dashed var(--bd)">
       <span class="cfg-mono" style="flex:none">前置：</span>
       ${others.map(o=>{const on=(t.after||[]).includes(o.title||'');
        return `<label style="font-size:11.5px;color:var(--tx-2);display:inline-flex;gap:4px;align-items:center">
        <input type="checkbox" ${on?'checked':''} onchange="tplToggleAfter(${i},'${esc(o.title||'')}',this.checked)">${esc((o.title||'未命名').slice(0,14))}</label>`;}).join('')}
      </div>`;})()}
   </div>`).join('')}
   <button class="btn" onclick="tplAddTodo()">＋ 增加任务</button>
   <div class="cfg-note" style="margin-top:12px">有前置的任务建项目时以「待解锁」状态存在，前置全部完成后由编排器自动解锁（变更进任务动态）。指派角色被删除时指派自动置空。</div>`;
  renderTplFlow();
}
function tplAddRole(){TPL.p.roles=TPL.p.roles||[];TPL.p.roles.push({def:'',name:''});renderTpl();}
function tplDelRole(i){
  const name=(TPL.p.roles[i].name||TPL.p.roles[i].def||'').trim();
  TPL.p.roles.splice(i,1);
  (TPL.p.initial_todos||[]).forEach(t=>{if((t.assign_role||'')===name)t.assign_role='';});
  renderTpl();
}
function tplRoleRenamed(i,v){
  const old=(TPL.p.roles[i].name||TPL.p.roles[i].def||'').trim();
  TPL.p.roles[i].name=v;
  (TPL.p.initial_todos||[]).forEach(t=>{if((t.assign_role||'')===old)t.assign_role=v;});
}
function tplSetPm(i){(TPL.p.roles||[]).forEach((r,j)=>r.pm=(j===i));renderTpl();}
function tplTitleChanged(i,v){
  const old=(TPL.p.initial_todos[i].title||'').trim();
  TPL.p.initial_todos[i].title=v;
  (TPL.p.initial_todos||[]).forEach(t=>{
    if(Array.isArray(t.after))t.after=t.after.map(x=>x===old?v:x);});
  renderTpl();
}
function tplToggleAfter(i,dep,on){
  const t=TPL.p.initial_todos[i];
  t.after=Array.isArray(t.after)?[...t.after]:[];
  if(on&&!t.after.includes(dep))t.after.push(dep);
  if(!on)t.after=t.after.filter(x=>x!==dep);
  if(!t.after.length)t.after=undefined;
  renderTpl();
}
function tplAddTodo(){TPL.p.initial_todos=TPL.p.initial_todos||[];TPL.p.initial_todos.push({title:''});renderTpl();}
function tplDelTodo(i){
  const title=(TPL.p.initial_todos[i].title||'').trim();
  TPL.p.initial_todos.splice(i,1);
  (TPL.p.initial_todos||[]).forEach(t=>{
    if(Array.isArray(t.after))t.after=t.after.filter(x=>x!==title);});
  renderTpl();
}
let FLOW={sel:-1,drag:null,pos:{}};   // 拖拽位置/选中节点（会话态，不入 yaml）
function renderTplFlow(){
  const el=$('tpl-flow');if(!el)return;
  const ts=(TPL.p.initial_todos||[]);
  if(ts.length<1){el.innerHTML='';return;}
  const idx={};ts.forEach((t,i)=>idx[(t.title||'').trim()]=i);
  // 默认层次布局；被拖过的节点用自由位置
  const layer=Array(ts.length).fill(-1);
  const depth=t=>{const i=idx[(t.title||'').trim()];
    if(layer[i]>=0)return layer[i];
    const deps=(t.after||[]).map(d=>idx[d]).filter(x=>x!==undefined);
    layer[i]=deps.length?Math.max(...deps.map(d=>d===i?0:depth(ts[d])+1)):0;
    return layer[i];};
  ts.forEach(depth);
  const W=210,H=46,GX=46,GY=22;
  const cols={};ts.forEach((t,i)=>{(cols[layer[i]]=cols[layer[i]]||[]).push(i);});
  const maxCol=Math.max(1,...Object.values(cols).map(a=>a.length));
  const svgW=Math.max(Object.keys(cols).length*(W+GX)+GX,320), svgH=maxCol*(H+GY)+GY+8;
  const pos={};
  Object.entries(cols).forEach(([l,arr])=>arr.forEach((ti,row)=>{
    pos[ti]=FLOW.pos[ti]||{x:GX+Number(l)*(W+GX),y:GY+row*(H+GY)+(maxCol-arr.length)*(H+GY)/2};}));
  let svg=`<svg id="flow-svg" viewBox="0 0 ${svgW} ${svgH}" style="width:100%;max-width:960px;height:auto;background:var(--bg-subtle);border:1px solid var(--bd);border-radius:10px;touch-action:none">`;
  svg+=`<defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#9095a6"/></marker></defs>`;
  ts.forEach((t,i)=>{(t.after||[]).forEach(d=>{const di=idx[d];if(di===undefined||di===i||!pos[di]||!pos[i])return;
    const a=pos[di],b=pos[i];
    svg+=`<line x1="${a.x+W}" y1="${a.y+H/2}" x2="${b.x-4}" y2="${b.y+H/2}" stroke="#9095a6" stroke-width="1.4" marker-end="url(#ar)"/>`;});});
  ts.forEach((t,i)=>{const q=pos[i];FLOW.pos[i]=q;
    const ms=t.kind==='milestone', sel=FLOW.sel===i;
    svg+=`<g data-i="${i}" style="cursor:grab">
     <rect x="${q.x}" y="${q.y}" width="${W}" height="${H}" rx="9" fill="${sel?'#eef3ff':ms?'#f6f0ff':'#fff'}" stroke="${sel?'#2f6bff':ms?'#b79cf2':'#dfe0e8'}" stroke-width="${sel?2:(ms?1.6:1)}"/>
     <text x="${q.x+12}" y="${q.y+H/2+1}" dominant-baseline="middle" font-size="12" fill="#1b1c22" font-weight="${ms?650:500}">${ms?'🚩 ':''}${esc((t.title||'未命名').slice(0,15))}</text>
     ${t.assign_role?`<text x="${q.x+W-10}" y="${q.y+H-9}" text-anchor="end" font-size="9.5" fill="#9095a6">${esc(t.assign_role)}</text>`:''}
    </g>`;});
  svg+='</svg>';
  el.innerHTML='<div class="cfg-mono" style="margin-bottom:4px">编排画布 · 拖动节点自由布局；点两个节点连依赖（后点的以前置并入）'+(FLOW.sel>=0?'——已选中，再点一个目标节点':'')+'</div>'+svg;
  bindFlowEvents(svgW,svgH,W,H);
}
function bindFlowEvents(vw,vh,W,H){
  const svg=document.getElementById('flow-svg');if(!svg)return;
  const toSvg=e=>{const r=svg.getBoundingClientRect();
   return {x:(e.clientX-r.left)*(vw/r.width),y:(e.clientY-r.top)*(vh/r.height)};};
  let moved=false;
  svg.addEventListener('pointerdown',e=>{
   const g=e.target.closest('g[data-i]');if(!g)return;
   const i=+g.dataset.i,p=FLOW.pos[i],m=toSvg(e);
   moved=false;FLOW.drag={i,dx:p.x-m.x,dy:p.y-m.y};e.preventDefault();});
  svg.addEventListener('pointermove',e=>{
   if(!FLOW.drag)return;const m=toSvg(e),d=FLOW.drag;
   if(!moved)moved=true;
   FLOW.pos[d.i]={x:Math.max(4,d.dx+m.x),y:Math.max(4,d.dy+m.y)};
   renderTplFlow();});
  svg.addEventListener('pointerup',()=>{
   if(FLOW.drag&&!moved){
    const i=FLOW.drag.i;
    if(FLOW.sel===-1){FLOW.sel=i;}
    else if(FLOW.sel===i){FLOW.sel=-1;}
    else{
     // 后点的节点把选中节点并入前置
     const tgt=TPL.p.initial_todos[i], srcT=(TPL.p.initial_todos[FLOW.sel].title||'').trim();
     const title=(tgt.title||'').trim();
     tgt.after=Array.isArray(tgt.after)?[...tgt.after]:[];
     if(tgt.after.includes(srcT)) tgt.after=tgt.after.filter(x=>x!==srcT);
     else if(srcT!==title) tgt.after.push(srcT);
     if(!tgt.after.length)tgt.after=undefined;
     FLOW.sel=-1;
     renderTpl();return;
    }
   }
   FLOW.drag=null;renderTplFlow();});
}
async function tplSaveStructured(){
  if(TPL.mode==='raw'){
   const raw=$('tpl-raw').value;
   const r=await fetch('/api/admin/templates/'+TPL.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({raw})});
   const d=await r.json();
   if(d.ok){TPL.raw=raw;alert('已保存');}else alert(d.error||'失败');
   return;
  }
  TPL.p.name=$('t-name').value.trim();TPL.p.description=$('t-desc').value.trim();TPL.p.watchdog=$('t-wd').checked;
  const r=await fetch('/api/admin/templates/'+TPL.id+'/structured',{method:'PUT',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({template:TPL.p})});
  const d=await r.json();
  if(d.ok){TPL.raw=d.raw;alert('已保存（建项目即时生效）');renderList();}
  else alert(d.error||'保存失败');
}

/* ══ 深链：#agent= / #project= / #tpl= ══ */
function switchNav(v){
  const el=document.querySelector(`.nav-item[data-v="${v}"]`);
  if(el)el.click();
}
async function applyHash(){
  const h=location.hash;
  if(h.startsWith('#def=')){const defId=decodeURIComponent(h.slice(5));history.replaceState(null,'','#services');switchNav('agents');defDetail(defId);}
  else if(h.startsWith('#agent=')){
   // 服务实例深链 → 解析其类型后开类型配置页（配置对象=类型）
   const sid=decodeURIComponent(h.slice(7));history.replaceState(null,'','#services');switchNav('agents');
   const sv=await jget('/api/admin/services');
   const svc=(sv.services||[]).find(x=>x.service_id===sid);
   if(svc)defDetail(svc.agent_def_id);
  }
  else if(h.startsWith('#tpl=')){const tid=decodeURIComponent(h.slice(5));history.replaceState(null,'','#services');switchNav('templates');tplDetail(tid);}
}

/* init */
renderList();
applyHash();
setInterval(()=>{if(!$('rpage').classList.contains('open')&&!$('drawer').classList.contains('open'))renderList();},15000);
</script>
