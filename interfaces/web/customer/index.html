<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>元理 · AI 战略咨询</title>
<style>
:root{
  --bg:#ffffff; --bg-subtle:#f7f8fa; --bg-sunken:#f0f1f5; --rail:#fafafd;
  --bd:#ececf1; --bd-2:#dfe0e8;
  --tx:#1b1c22; --tx-2:#565a6b; --tx-3:#9095a6;
  --pri:#2f6bff; --pri-weak:#eef3ff; --pri-deep:#1d4fd8;
  --ok:#0e9f6e; --ok-weak:#e6f6ef; --warn:#c2790a; --warn-weak:#fdf3e2;
  --r-s:8px; --r-m:12px; --r-l:16px;
  --sh-1:0 1px 2px rgba(20,22,40,.05); --sh-2:0 10px 32px rgba(20,22,40,.10);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:var(--font)}
::selection{background:var(--pri-weak)}

/* ══ 布局骨架：左 rail + 中 main + 右 drawer ══ */
.app{height:100vh;display:flex}
.rail{width:264px;flex:none;background:var(--rail);border-right:1px solid var(--bd);display:flex;flex-direction:column}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.drawer{width:0;flex:none;background:var(--bg);border-left:1px solid var(--bd);overflow:hidden;transition:width .18s ease;display:flex;flex-direction:column}
.drawer.open{width:340px}

/* ══ 左侧栏 ══ */
.rail-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2f6bff,#0e9f6e);display:flex;align-items:center;justify-content:center;flex:none}
.mark svg{width:15px;height:15px}
.rail-brand b{font-size:14.5px;letter-spacing:.2px}
.rail-brand small{display:block;font-size:11px;color:var(--tx-3);font-weight:400}
.new-btn{margin:4px 14px 10px;display:flex;align-items:center;gap:8px;border:1px solid var(--bd-2);background:var(--bg);border-radius:var(--r-m);padding:9px 12px;font-size:13.5px;font-weight:550;color:var(--tx);cursor:pointer;transition:all .15s;box-shadow:var(--sh-1)}
.new-btn:hover{border-color:var(--pri);color:var(--pri)}
.new-btn svg{width:15px;height:15px}
.rail-cap{font-size:11px;color:var(--tx-3);letter-spacing:1.5px;font-weight:600;padding:8px 18px 6px}
.rail-list{flex:1;overflow-y:auto;padding:0 10px}
.sess{padding:10px 12px;border-radius:var(--r-m);cursor:pointer;transition:background .12s;margin-bottom:2px}
.sess:hover{background:var(--bg-sunken)}
.sess.on{background:var(--pri-weak)}
.sess .t{font-size:13px;font-weight:550;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sess.on .t{color:var(--pri-deep)}
.sess .m{display:flex;gap:6px;align-items:center;margin-top:4px;font-size:11px;color:var(--tx-3)}
.sess .dot-st{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.sess .dot-st.fin{background:var(--tx-3)}
.rail-empty{padding:18px;font-size:12px;color:var(--tx-3);line-height:1.7}
.rail-foot{border-top:1px solid var(--bd);padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.rail-cfg{display:flex;align-items:center;gap:9px;padding:8px 8px;border-radius:var(--r-s);font-size:12.5px;color:var(--tx-2);cursor:pointer;transition:background .12s}
.rail-cfg:hover{background:var(--bg-sunken)}
.rail-cfg svg{width:15px;height:15px;color:var(--tx-3)}
.rail-cfg.danger:hover{color:#c0353b}
.rail-cfg b{font-weight:550;color:var(--tx)}

/* ══ 会话头 ══ */
.ch-head{flex:none;height:58px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--bd)}
.ch-title{min-width:0}
.ch-name{font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px;letter-spacing:.2px}
.ch-sub{font-size:11.5px;color:var(--tx-3);margin-top:1px}
.seg{margin-left:auto;display:flex;gap:2px;padding:3px;background:var(--bg-sunken);border-radius:11px}
.seg button{display:flex;align-items:center;gap:6px;border:none;background:transparent;padding:6px 14px;border-radius:9px;font-size:12.5px;font-weight:550;color:var(--tx-2);cursor:pointer;transition:all .15s;position:relative;white-space:nowrap}
.seg button svg{width:14px;height:14px;opacity:.8}
.seg button.on{background:var(--bg);color:var(--tx);box-shadow:var(--sh-1)}
.seg .dot{position:absolute;top:5px;right:7px;width:6px;height:6px;border-radius:50%;background:#e5484d}
.pill{margin-left:10px;flex:none;display:inline-flex;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--pri-weak);color:var(--pri-deep)}

/* ══ 主区 panes ══ */
.pane{flex:1;min-height:0;display:none;flex-direction:column}
.pane.on{display:flex}
.scroll{flex:1;overflow-y:auto;min-height:0}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:var(--bd-2);border-radius:4px;border:2px solid var(--bg)}

/* 对话流 */
.col{max-width:760px;margin:0 auto;padding:26px 24px 18px;display:flex;flex-direction:column;gap:24px}
.msg-u{align-self:flex-end;max-width:82%;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.msg-u .who{font-size:11px;color:var(--tx-3)}
.msg-u .bub{background:var(--pri-weak);padding:11px 16px;border-radius:16px 16px 4px 16px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg-a{display:flex;gap:12px}
.msg-a .ava{flex:none;width:30px;height:30px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:650;margin-top:2px}
.msg-a .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.msg-a .hd b{font-size:13px}
.msg-a .hd span{font-size:11px;color:var(--tx-3)}
.doc .body{font-size:14.5px;line-height:1.9}
.doc .body p{margin:0 0 .7em}.doc .body p:last-child{margin:0}
.doc .body h3{font-size:14.5px;margin:1em 0 .4em;font-weight:650}
.doc .body ul{margin:.3em 0 .8em;padding-left:1.3em}.doc .body li{margin:.25em 0}
.doc .body b{font-weight:650}
.mk{font-size:11px;padding:1px 7px;border-radius:5px;font-weight:600;vertical-align:1px}
.mk-inf{background:var(--warn-weak);color:var(--warn)}
.mk-todo{background:var(--bg-sunken);color:var(--tx-2)}
.mk-draft{background:var(--pri-weak);color:var(--pri-deep)}
.typing{display:inline-flex;align-items:center;gap:5px;padding:9px 13px;background:var(--bg-subtle);border-radius:11px;color:var(--tx-3);font-size:12.5px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--tx-3);animation:tp 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
/* hero */
.hero{margin:auto;max-width:620px;text-align:center;padding:24px}
.hero .mark{width:52px;height:52px;border-radius:15px;margin:0 auto 18px;box-shadow:var(--sh-2)}
.hero .mark svg{width:26px;height:26px}
.hero h1{font-size:28px;font-weight:700;letter-spacing:.3px;line-height:1.3}
.hero h1 em{font-style:normal;color:var(--pri)}
.hero .sub{color:var(--tx-2);font-size:14px;line-height:1.8;margin:13px 0 24px}
.chips{display:flex;flex-direction:column;gap:10px;text-align:left}
.chip{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r-m);padding:13px 16px;cursor:pointer;transition:all .15s;font-size:13.5px;line-height:1.6;color:var(--tx-2)}
.chip:hover{border-color:var(--pri);box-shadow:var(--sh-1);color:var(--tx)}
.chip svg{flex:none;width:16px;height:16px;margin-top:2px;color:var(--tx-3)}
.hero .tip{margin-top:20px;font-size:12px;color:var(--tx-3)}
/* composer */
.comp-wrap{flex:none;padding:8px 20px 14px;background:linear-gradient(transparent,var(--bg) 34%)}
.comp{max-width:760px;margin:0 auto;border:1px solid var(--bd-2);border-radius:var(--r-l);padding:9px 12px;display:flex;gap:10px;align-items:flex-end;transition:all .15s;box-shadow:var(--sh-1)}
.comp:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-weak)}
.comp .nm{flex:none;width:92px;border:none;background:transparent;font-size:13px;color:var(--tx-2);padding:10px 2px}
.comp .nm:focus,.comp textarea:focus{outline:none}
.comp textarea{flex:1;border:none;background:transparent;resize:none;font-family:var(--font);font-size:14px;line-height:1.6;padding:10px 2px;max-height:120px}
.comp .send{flex:none;width:36px;height:36px;border-radius:11px;border:none;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.comp .send:hover{background:var(--pri-deep)}
.comp .send:disabled{background:var(--bd-2);cursor:default}
.comp .send svg{width:16px;height:16px}
.foot-note{max-width:760px;margin:7px auto 0;text-align:center;font-size:11px;color:var(--tx-3)}

/* 团队动态 */
.steps{display:flex;align-items:flex-start;padding:22px 24px 12px;max-width:760px;margin:0 auto;width:100%}
.stp{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0}
.stp .c{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bd-2);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--tx-3)}
.stp .c svg{width:12px;height:12px}
.stp span{font-size:11.5px;color:var(--tx-3);white-space:nowrap}
.stp.doing .c{border-color:var(--pri);color:var(--pri);box-shadow:0 0 0 4px var(--pri-weak)}
.stp.doing span{color:var(--pri-deep);font-weight:600}
.stp.done .c{border-color:var(--ok);background:var(--ok);color:#fff}
.stp.done span{color:var(--tx-2)}
.stp-ln{flex:1;height:1.5px;background:var(--bd);margin-top:13px;min-width:14px}
.stp-ln.done{background:var(--ok)}
.tl{max-width:760px;margin:0 auto;padding:4px 24px 26px;width:100%}
.tl-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.tl-head .h{font-size:13px;font-weight:650;color:var(--tx-2)}
.rawbtn{border:none;background:transparent;font-size:12px;color:var(--tx-3);cursor:pointer;padding:4px 8px;border-radius:7px}
.rawbtn:hover{background:var(--bg-subtle);color:var(--tx)}
.raw{border:1px solid var(--bd);border-radius:var(--r-m);padding:8px 14px;font-size:12.5px;color:var(--tx-2);margin-bottom:8px;background:var(--bg-subtle);line-height:1.7}
.raw b{color:var(--tx)}
.ev{display:flex;gap:12px;position:relative;padding-bottom:18px}
.ev::before{content:'';position:absolute;left:13px;top:30px;bottom:2px;width:1.5px;background:var(--bd)}
.ev:last-child::before{display:none}
.ev .n{flex:none;width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--bd-2);background:var(--bg);z-index:1}
.ev .n svg{width:13px;height:13px}
.ev.k-deliver .n,.ev.k-file .n{border-color:#cddcff;background:var(--pri-weak);color:var(--pri-deep)}
.ev.k-accept .n{border-color:#bfe8d5;background:var(--ok-weak);color:var(--ok)}
.ev.k-qc .n{border-color:#f0dcae;background:var(--warn-weak);color:var(--warn)}
.ev.k-done .n{border-color:var(--ok);background:var(--ok);color:#fff}
.ev.k-assign .n{color:var(--tx-2)}.ev.k-note .n{color:var(--tx-3)}
.ev .c{flex:1;min-width:0;padding-top:4px}
.ev .l1{display:flex;align-items:baseline;gap:8px}
.ev .l1 b{font-size:13.5px;font-weight:600}
.ev .l1 .act-t{font-size:13px;color:var(--tx-2)}
.ev .l1 .t{margin-left:auto;font-size:11px;color:var(--tx-3);flex:none}
.ev .sub{font-size:12.5px;color:var(--tx-3);line-height:1.6;margin-top:4px;cursor:pointer}
.sk{display:flex;gap:12px;padding-bottom:18px}
.sk .l{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--bg-sunken) 25%,#e9eaf0 50%,var(--bg-sunken) 75%);background-size:200% 100%;animation:shim 1.3s infinite;margin-bottom:9px}
@keyframes shim{to{background-position:-200% 0}}

/* 交付物 */
.fwrap{max-width:760px;margin:0 auto;padding:18px 24px 26px;width:100%}
.crumb{font-size:12.5px;color:var(--tx-3);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.crumb span{cursor:pointer}.crumb span:hover{color:var(--pri)}
.crumb .cur{color:var(--tx);font-weight:550}
.frow{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:var(--r-m);cursor:pointer;transition:all .12s;border:1px solid transparent}
.frow:hover{background:var(--bg-subtle);border-color:var(--bd)}
.frow svg{width:17px;height:17px;flex:none;color:var(--tx-3)}
.frow.dir svg{color:var(--pri)}
.frow b{font-size:13.5px;font-weight:550}
.frow .sz{margin-left:auto;font-size:11px;color:var(--tx-3)}
.fdoc{border:1px solid var(--bd);border-radius:var(--r-m);overflow:hidden}
.fdoc .fh{display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid var(--bd);background:var(--bg-subtle);font-size:13px;font-weight:600}
.fdoc .fh svg{width:15px;height:15px;color:var(--tx-3)}
.fdoc pre{padding:18px 20px;font-family:var(--font);font-size:13.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto}

/* ══ 右侧抽屉（成员/明细下钻） ══ */
.dw-head{flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd)}
.dw-head .a{width:34px;height:34px;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:650}
.dw-head b{font-size:14px}
.dw-head small{display:block;font-size:11px;color:var(--tx-3)}
.dw-head .x{margin-left:auto;border:none;background:none;font-size:15px;color:var(--tx-3);cursor:pointer;padding:4px 8px;border-radius:7px}
.dw-head .x:hover{background:var(--bg-subtle)}
.dw-body{flex:1;overflow-y:auto;padding:14px 16px}
.dw-body h6{font-size:11px;color:var(--tx-3);letter-spacing:1.5px;margin:12px 0 8px;font-weight:600}
.dw-todo{display:flex;gap:9px;padding:7px 8px;font-size:12.5px;align-items:flex-start}
.dw-todo .bx{flex:none;width:15px;height:15px;border-radius:5px;border:1.5px solid var(--bd-2);margin-top:2px}
.dw-todo.done .bx{background:var(--ok);border-color:var(--ok)}
.dw-todo.done .tt{color:var(--tx-3);text-decoration:line-through}
/* ── 群聊（团队沟通） ── */
.grp{max-width:820px;margin:0 auto;padding:22px 24px 26px;display:flex;flex-direction:column;gap:16px}
.grp-cap{font-size:12px;color:var(--tx-3);text-align:center;padding-bottom:4px}
.gm{display:flex;gap:10px}
.gm .a{flex:none;width:30px;height:30px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:650;margin-top:1px;cursor:pointer}
.gm .c{max-width:86%;min-width:0}
.gm .h{display:flex;align-items:baseline;gap:7px;margin-bottom:3px}
.gm .h b{font-size:12.5px;font-weight:600}
.gm .h span{font-size:10.5px;color:var(--tx-3)}
.gm .b{background:var(--bg-subtle);border:1px solid var(--bd);border-radius:4px 14px 14px 14px;padding:9px 14px;font-size:13.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.gm.me{flex-direction:row-reverse}
.gm.me .c{display:flex;flex-direction:column;align-items:flex-end}
.gm.me .b{background:var(--pri-weak);border-color:transparent;border-radius:14px 4px 14px 14px}
/* ── 响应式 ── */
.menu-btn{display:none;flex:none;width:34px;height:34px;border:1px solid var(--bd-2);background:var(--bg);border-radius:9px;cursor:pointer;align-items:center;justify-content:center;color:var(--tx-2)}
.menu-btn svg{width:16px;height:16px}
@media(max-width:1160px){
  .seg button span{display:none}
  .seg button{padding:7px 11px}
  .ch-sub{display:none}
  .pill{padding:4px 9px;font-size:11px}
}
@media(max-width:880px){
  .menu-btn{display:flex}
  .rail{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--sh-2)}
  .rail.open{transform:none}
  .veil{position:fixed;inset:0;background:rgba(15,17,30,.32);z-index:39;opacity:0;pointer-events:none;transition:opacity .2s}
  .veil.on{opacity:1;pointer-events:auto}
  .ch-name{max-width:150px;font-size:14px}
  .col,.grp,.tl,.steps,.fwrap,.comp{padding-left:14px;padding-right:14px}
  .comp .nm{width:72px}
  .drawer.open{width:min(320px,88vw);position:fixed;right:0;top:0;bottom:0;z-index:40;box-shadow:var(--sh-2)}
}
@media(max-width:560px){
  .pill{display:none!important}
  .seg{padding:2px}
  .msg-u{max-width:94%}
  .gm .c{max-width:92%}
  .hero h1{font-size:22px}
}
</style>
</head>
<body>
<div class="veil" id="veil" onclick="toggleRail()"></div>
<div class="app">
  <!-- 左：会话历史 rail -->
  <aside class="rail" id="rail-el">
    <div class="rail-brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/></svg></div>
      <div><b>元理 · 战略咨询</b><small>AI 咨询团队工作台</small></div>
    </div>
    <button class="new-btn" onclick="newSession()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新的咨询</button>
    <div class="rail-cap">咨询记录</div>
    <div class="rail-list" id="hist"></div>
    <div class="rail-foot">
      <div class="rail-cfg" onclick="promptName()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>称呼：<b id="who-name">未设置</b></span></div>
      <div class="rail-cfg danger" onclick="resetAll()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>清空本地会话</div>
    </div>
  </aside>

  <!-- 中：会话主区 -->
  <div class="main">
    <header class="ch-head">
      <button class="menu-btn" id="menu" onclick="toggleRail()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="ch-title">
        <div class="ch-name" id="ch-name">新的咨询</div>
        <div class="ch-sub" id="ch-sub">描述您的企业问题，团队即刻组建</div>
      </div>
      <div class="seg" id="seg">
        <button class="on" data-p="chat" title="对话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>对话</span></button>
        <button data-p="comm" id="tab-comm" title="团队沟通" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>团队沟通</span></button>
        <button data-p="tasks" id="tab-tasks" title="任务协作" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span>任务协作</span></button>
        <button data-p="files" id="tab-files" title="交付物" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span>交付物</span></button>
      </div>
      <span class="pill" id="stage" style="display:none"></span>
    </header>

    <div class="pane on" id="p-chat">
      <div class="scroll"><div class="col" id="chat"></div></div>
      <div class="comp-wrap">
        <div class="comp">
          <input id="name" class="nm" placeholder="您的称呼">
          <textarea id="text" placeholder="一句话描述您的企业和想解决的问题…（Enter 发送）"></textarea>
          <button id="send" class="send" title="发送"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
        <div class="foot-note">首次发言自动组建咨询团队 · 过程实时可见 · 完成后合伙人向您汇报</div>
      </div>
    </div>
    <div class="pane" id="p-comm"><div class="scroll"><div class="grp" id="grp"></div></div></div>
    <div class="pane" id="p-tasks"><div class="scroll">
      <div class="steps" id="steps"></div>
      <div class="tl" id="tl"></div>
    </div></div>
    <div class="pane" id="p-files"><div class="scroll"><div class="fwrap" id="files"></div></div></div>
  </div>

  <!-- 右：明细抽屉 -->
  <aside class="drawer" id="drawer">
    <div class="dw-head" id="dw-head"></div>
    <div class="dw-body" id="dw-body"></div>
  </aside>
</div>
<script>
const $=id=>document.getElementById(id);
const chatEl=$('chat'),nameEl=$('name'),textEl=$('text'),sendBtn=$('send');
let cid=localStorage.getItem('yl_customer_id')||'';
let projSel=localStorage.getItem('yl_proj_'+cid)||'';
let myName=localStorage.getItem('yl_name')||'';
if(myName)nameEl.value=myName;
let sig={chat:'',act:'',files:''};let filePath='';let rawMode=false;let projCache=[];
const AVA=['#2f6bff','#0e9f6e','#c2790a','#7a5cff','#e0526d'];
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const icoN={
 assign:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
 deliver:'<path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"/>',
 accept:'<path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4 12 14l-3-3"/>',
 qc:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
 revise:'<path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
 done:'<path d="M20 6 9 17l-5-5"/>',
 note:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
 file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
 dir:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
 spark:'<path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/>',
 shop:'<path d="M3 9l1.5-6h15L21 9M3 9v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9M3 9h18M9 21v-6h6v6"/>',
 factory:'<path d="M2 20h20V9l-6 4V9l-6 4V4H2z"/>',
 chart:'<path d="M3 3v18h18M8 17V9M13 17V5M18 17v-6"/>',
 user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
};
const svg=(n,w=15)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:${w}px;height:${w}px">${icoN[n]}</svg>`;
const avc=n=>{let s=0;for(const c of(n||'x'))s+=c.charCodeAt(0);return AVA[s%AVA.length]};
function md(t){let h=esc(t);
 h=h.replace(/^###?\s*(.+)$/gm,'<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
 h=h.replace(/^\s*[-•]\s+(.+)$/gm,'<li>$1</li>').replace(/^\s*\d+[.、]\s+(.+)$/gm,'<li>$1</li>');
 h=h.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,m=>'<ul>'+m+'</ul>');
 return h.split(/\n{2,}/).map(p=>/^<(h3|ul)/.test(p.trim())?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');}
const trust=h=>h.replace(/【推断】/g,'<span class="mk mk-inf">推断</span>').replace(/待验证/g,'<span class="mk mk-todo">待验证</span>').replace(/初稿/g,'<span class="mk mk-draft">初稿</span>');
const EXAMPLES=[
 ['shop','我们是连锁餐饮品牌，12 家门店，想知道 AI 能怎么帮我们做会员复购和选址'],
 ['factory','我们是一家 50 人的零部件加工厂，靠外贸 B2B 平台接单，想用 AI 提高询盘转化'],
 ['chart','我们做企业 SaaS，年营收 3000 万，销售靠人海，想知道 AI 销售助手值不值得投入'],
];

/* ── rail：会话历史 ── */
function renderHist(){
 const el=$('hist');
 if(!projCache.length){el.innerHTML='<div class="rail-empty">还没有咨询记录<br>一句话开始第一单 →</div>';return;}
 el.innerHTML=projCache.map(p=>`<div class="sess ${p.project_id===projSel?'on':''}" onclick="switchProj('${p.project_id}')">
   <div class="t">${esc(p.name)}</div>
   <div class="m"><span class="dot-st ${p.status!=='active'?'fin':''}"></span>${p.status==='active'?'进行中':'已完成'} · ${esc((p.created_at||'').slice(5,10))}</div></div>`).join('');
}
function switchProj(pid){projSel=pid;localStorage.setItem('yl_proj_'+cid,projSel);
 sig={chat:'',act:'',files:''};commSig='';filePath='';chatEl.innerHTML='';
 loadHead();poll();pollComm();pollTeam();pollFiles();renderHist();}
function newSession(){cid='';projSel='';projCache=[];localStorage.removeItem('yl_customer_id');
 sig={chat:'',act:'',files:''};filePath='';chatEl.innerHTML='';
 $('tab-team').style.display='none';$('tab-files').style.display='none';$('stage').style.display='none';
 setPane('chat');welcome();renderHist();loadHead();}
function resetAll(){localStorage.clear();location.reload();}
function promptName(){const n=prompt('您的称呼',myName||'');if(n){myName=n.trim();nameEl.value=myName;localStorage.setItem('yl_name',myName);$('who-name').textContent=myName||'未设置';}}
nameEl.addEventListener('change',()=>{myName=nameEl.value.trim();localStorage.setItem('yl_name',myName);$('who-name').textContent=myName||'未设置';});

function loadHead(){
 if(cid&&projCache.length){const p=projCache.find(x=>x.project_id===projSel)||projCache[0];
  if(p){$('ch-name').textContent=p.name;$('ch-sub').textContent=p.status==='active'?'咨询团队工作中 · 过程实时可见':'本轮分析已完成 · 可继续追问迭代';}}
 else{$('ch-name').textContent='新的咨询';$('ch-sub').textContent='描述您的企业问题，团队即刻组建';}
}
function setPane(p){document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
 document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id==='p-'+p));}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{
 setPane(b.dataset.p);const d=b.querySelector('.dot');d&&d.remove();
 if(b.dataset.p==='comm')pollComm(true);
 if(b.dataset.p==='tasks')pollTeam(true);
 if(b.dataset.p==='files')pollFiles(true);});
function toggleRail(){$('rail-el').classList.toggle('open');$('veil').classList.toggle('on');}

async function jget(u){
 if(projSel&&u.includes('/api/customer/sessions/')&&!u.includes('project_id=')){
  const [p,q]=u.split('?');u=p+'?'+((q?q+'&':'')+'project_id='+encodeURIComponent(projSel));}
 const r=await fetch(u);return r.json()}
async function loadProjects(){
 if(!cid)return;
 try{const d=await jget('/api/customer/sessions?customer_id='+encodeURIComponent(cid));
  if(d.projects&&d.projects.length){projCache=d.projects;
   if(!projSel){projSel=d.projects[0].project_id;localStorage.setItem('yl_proj_'+cid,projSel);}
   renderHist();loadHead();}
 }catch(e){}}

/* ── 对话 ── */
function bubble(m){
 if(m.from==='customer'){
  chatEl.insertAdjacentHTML('beforeend',`<div class="msg-u"><div class="who">${esc(m.sender_name||'我')}</div><div class="bub">${esc(m.text)}</div></div>`);return;}
 chatEl.insertAdjacentHTML('beforeend',`<div class="msg-a">
  <div class="ava" style="background:${avc(m.sender_name)}">${esc((m.sender_name||'咨')[0])}</div>
  <div class="doc"><div class="hd"><b>${esc(m.sender_name||'咨询合伙人')}</b><span>元理咨询</span></div>
  <div class="body">${trust(md(m.text))}</div></div></div>`);}
function typing(){chatEl.insertAdjacentHTML('beforeend',`<div class="msg-a" id="typing">
 <div class="ava" style="background:#8f91a3">…</div><div><div class="typing"><i></i><i></i><i></i> 团队工作中</div></div></div>`);}
function welcome(){chatEl.innerHTML=`<div class="hero">
 <div class="mark">${svg('spark',26)}</div>
 <h1>一句话，启动一支<em>咨询团队</em></h1>
 <div class="sub">告诉我们您的企业和想解决的问题——合伙人受理、双线研究、独立质控、结论汇报，全程实时可见。</div>
 <div class="chips">${EXAMPLES.map((e,i)=>`<div class="chip" onclick="useEx(${i})">${svg(e[0],16)}<span>${e[1]}</span></div>`).join('')}</div>
 <div class="tip">团队通常在半小时内完成一轮完整分析 · 您的资料可随时补充</div></div>`;}
function useEx(i){textEl.value=EXAMPLES[i][1];textEl.focus();}
let memberSid={},teamCache=[],todosCache=[];
async function poll(){
 if(!cid)return;try{
  const d=await jget(`/api/customer/sessions/${cid}/messages`);
  const s=JSON.stringify(d.messages);
  if(s!==sig.chat){sig.chat=s;chatEl.innerHTML='';
   if(!d.messages.length){welcome();}
   d.messages.forEach(bubble);
   const last=d.messages[d.messages.length-1];
   if(last&&last.from==='customer'&&d.stage!=='已完成')typing();
   chatEl.parentElement.scrollTop=1e9;}
  if(d.team){
   $('tab-comm').style.display='inline-flex';$('tab-tasks').style.display='inline-flex';$('tab-files').style.display='inline-flex';
   $('stage').style.display='inline-flex';$('stage').textContent=d.stage;
   teamCache=d.team;todosCache=d.todos||[];
   (d.team||[]).forEach(t=>memberSid[t.role]=t.sid);}
 }catch(e){}}

/* ── 团队沟通：项目群回放（点头像看成员明细） ── */
let commSig='';
async function pollComm(force){
 if(!cid)return;try{
  const d=await jget(`/api/customer/sessions/${cid}/team`);
  const g=JSON.stringify(d.messages);
  if(force||g!==commSig){commSig=g;
   const el=$('grp');
   if(!d.messages.length){
    el.innerHTML='<div style="text-align:center;color:var(--tx-3);padding:56px 0;font-size:13px">团队已组建，沟通将在这里实时出现</div>';
   }else{
    el.innerHTML='<div class="grp-cap">以下是项目群的真实沟通过程（' + d.messages.length + ' 条）</div>'+
     d.messages.map(m=>{
      const me=m.from==='self';
      return `<div class="gm ${me?'me':''}">
       <div class="a" style="background:${avc(m.sender_name)}" onclick="openMember('${esc(m.sender_name)}')">${esc((m.sender_name||'?')[0])}</div>
       <div class="c"><div class="h"><b>${esc(m.sender_name)}</b><span>${esc(m.ts)}</span></div>
       <div class="b">${trust(md(m.text))}</div></div></div>`;}).join('');
    el.parentElement.scrollTop=1e9;
   }
   // 红点挂在沟通 tab
   const seen=+localStorage.getItem('yl_seen_'+cid)||0;
   if(d.messages.length>seen&&!$('p-comm').classList.contains('on')){
    if(!$('tab-comm').querySelector('.dot'))$('tab-comm').insertAdjacentHTML('beforeend','<span class="dot"></span>');
   }else if($('p-comm').classList.contains('on')){localStorage.setItem('yl_seen_'+cid,d.messages.length);}
  }
 }catch(e){}}

/* ── 任务协作：阶段步骤 + 转译动态 ── */
async function pollTeam(force){
 if(!cid)return;try{
  const d=await jget(`/api/customer/sessions/${cid}/activity`);
  const g=JSON.stringify([d.activities,d.steps,d.current_stage]);
  if(force||g!==sig.act){sig.act=g;
   $('steps').innerHTML=d.steps.map((st,i)=>`${i?`<div class="stp-ln ${d.steps[i-1].state}"></div>`:''}
    <div class="stp ${st.state}"><div class="c">${st.state==='done'?svg('done',12):i+1}</div><span>${esc(st.name)}</span></div>`).join('');
   $('tl').innerHTML=`<div class="tl-head"><span class="h">任务动态 · 点成员看明细</span></div>`+
     d.activities.map(a=>`<div class="ev k-${a.kind}">
      <div class="n">${svg(a.kind,13)}</div>
      <div class="c"><div class="l1"><b style="cursor:pointer" onclick="openMember('${esc(a.actor)}')">${esc(a.actor)}</b><span class="act-t">${esc(a.text.replace(a.actor,'').trim())}</span><span class="t">${esc(a.ts)}</span></div>
      ${a.detail&&a.kind!=='note'?`<div class="sub" onclick="this.style.display='none'">${esc(a.detail.slice(0,150))}${a.detail.length>150?' …':''}</div>`:''}</div></div>`).join('')
     ||`<div class="sk"><div style="flex:1"><div class="l" style="width:38%"></div><div class="l" style="width:64%"></div><div class="l" style="width:52%"></div></div></div>`;
  }
 }catch(e){}}

/* ── 交付物 ── */
async function pollFiles(force){
 if(!cid)return;try{
  const d=await jget(`/api/customer/sessions/${cid}/files?path=${encodeURIComponent(filePath)}`);
  if(force||JSON.stringify(d)!==sig.files){sig.files=JSON.stringify(d);
   if(d.kind==='dir'){
    $('files').innerHTML=`<div class="crumb"><span onclick="goPath('')">交付物</span>${filePath?`<span>›</span><span class="cur">${esc(filePath)}</span>`:''}</div>`+
     d.entries.map(e=>`<div class="frow ${e.type==='dir'?'dir':''}" onclick="goPath('${e.rel}')">${svg(e.type==='dir'?'dir':'file',17)}<b>${esc(e.name)}</b>${e.type==='dir'?'':`<span class="sz">${(e.size/1000).toFixed(1)} KB</span>`}</div>`).join('')
     ||'<div style="text-align:center;color:var(--tx-3);padding:56px 0;font-size:13px">团队尚未交付文件</div>';
   }else{
    $('files').innerHTML=`<div class="crumb"><span onclick="goPath('')">交付物</span><span>›</span><span class="cur">${esc(filePath.split('/').pop())}</span></div>
     <div class="fdoc"><div class="fh">${svg('file',15)}${esc(filePath.split('/').pop())}</div><pre>${esc(d.content)}</pre></div>`;}
  }}catch(e){}}
function goPath(p){filePath=p;sig.files='';pollFiles(true);}

/* ── 抽屉：成员明细 ── */
function closeDrawer(){$('drawer').classList.remove('open')}
async function openMember(role){
 const sid=memberSid[role];if(!sid)return;
 const d=await jget(`/api/customer/sessions/${cid}/members/${sid}`);
 if(!d.ok)return;
 const mine=todosCache.filter(t=>t.assignee===role);
 $('dw-head').innerHTML=`<div class="a" style="background:${avc(role)}">${esc((role||'?')[0])}</div>
  <div><b>${esc(role)}</b><small>项目成员 · 点成员名随时查看</small></div><button class="x" onclick="closeDrawer()">✕</button>`;
 $('dw-body').innerHTML=`<h6>负责任务（${mine.length}）</h6>`+
  (mine.map(t=>`<div class="dw-todo ${t.status}"><div class="bx"></div><div class="tt">${esc(t.title)}</div></div>`).join('')||'<div style="font-size:12px;color:var(--tx-3);padding:4px 8px">暂无分派任务</div>')+
  `<h6>唤醒记录（${d.wakes.length}）</h6>`+
  (d.wakes.map(w=>`<div class="ev k-note" style="padding-bottom:12px"><div class="n">${svg('spark',12)}</div>
   <div class="c"><div class="l1"><b>#${w.seq}</b><span class="act-t">${esc(w.reason)}</span><span class="t">${esc(w.at)}</span></div></div></div>`).join('')||'<div style="font-size:12px;color:var(--tx-3);padding:4px 8px">尚无唤醒</div>');
 $('drawer').classList.add('open');
}

/* ── 发送 ── */
sendBtn.onclick=async()=>{
 const text=textEl.value.trim();if(!text)return;
 const customer_name=nameEl.value.trim()||'客户';
 if(myName!==customer_name){myName=customer_name;localStorage.setItem('yl_name',myName);$('who-name').textContent=myName;}
 chatEl.innerHTML='';
 bubble({from:'customer',sender_name:customer_name,text});typing();sendBtn.disabled=true;
 try{const r=await fetch('/api/customer/sessions',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({customer_name,text,customer_id:cid,template:'ai_strategy'})});
  const d=await r.json();
  if(d.ok){cid=d.customer_id;localStorage.setItem('yl_customer_id',cid);await loadProjects();}
  else{const t=$('typing');t&&t.remove();bubble({from:'consultant',sender_name:'系统',text:'发送失败：'+(d.error||'未知错误')});}
 }catch(e){bubble({from:'consultant',sender_name:'系统',text:'网络错误，请重试'});}
 textEl.value='';sendBtn.disabled=false;poll();};
textEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendBtn.click();}});

/* ── init ── */
$('who-name').textContent=myName||'未设置';
if(cid){loadProjects();poll();pollComm();pollTeam();}else{welcome();}
setInterval(()=>{poll();pollComm();pollTeam();},5000);
</script>
</body>
</html>
