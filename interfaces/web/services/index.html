<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服务台 · 元理</title>
<style>
:root{--primary:#2563eb;--glow:rgba(37,99,235,.10);--ok:#059669;--warn:#d97706;--bg:#f6f7fb;--card:#fff;--soft:#f9fafb;--bd:#e5e7eb;--tm:#111827;--td:#6b7280;--shadow:0 1px 2px rgba(15,23,42,.04),0 12px 32px rgba(15,23,42,.05);--font:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--tm)}
header{background:rgba(255,255,255,.92);border-bottom:1px solid var(--bd);padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
h1{font-size:16px}h1 small{color:var(--td);font-weight:400;font-size:12px;margin-left:8px}
.tabs{margin:18px 24px 0;display:flex;gap:8px}
.tab{padding:8px 18px;border-radius:10px;font-size:14px;cursor:pointer;background:var(--card);border:1px solid var(--bd);font-weight:600;color:var(--td)}
.tab.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.wrap{padding:18px 24px;overflow-x:auto}
table{width:100%;min-width:960px;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);font-size:13px}
th{background:var(--soft);color:var(--td);text-align:left;padding:10px 14px;font-size:12px;letter-spacing:.5px}
td{padding:11px 14px;border-top:1px solid var(--bd);vertical-align:top}
tr:hover td{background:#fafbfd}
.mono{font-family:ui-monospace,monospace;font-size:12px;color:var(--td)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
.b-green{background:rgba(5,150,105,.1);color:var(--ok)}
.b-gray{background:#f3f4f6;color:var(--td)}
.b-blue{background:var(--glow);color:var(--primary)}
.b-amber{background:rgba(217,119,6,.1);color:var(--warn)}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;margin-right:6px}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.hint{color:var(--td);font-size:12px;margin:8px 2px}
/* 抽屉 */
#drawer{position:fixed;top:0;right:-460px;width:min(440px,94vw);height:100vh;background:var(--card);box-shadow:-12px 0 40px rgba(15,23,42,.12);transition:right .2s;z-index:20;display:flex;flex-direction:column}
#drawer.open{right:0}
.dh{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.dh b{font-size:15px}.dh .x{cursor:pointer;color:var(--td);font-size:16px;border:none;background:none}
.db{flex:1;overflow-y:auto;padding:16px 20px;font-size:13px}
.wake{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--soft)}
.wake b{font-size:12px}.wake .m{color:var(--td);font-size:11px;margin-top:3px}
.kv{display:flex;gap:8px;margin:4px 0}.kv i{width:88px;color:var(--td);font-style:normal;font-size:12px;flex:none}
.msg{border-left:3px solid var(--primary);background:var(--soft);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:13px}
.msg .m{font-size:11px;color:var(--td);margin-bottom:3px}
.msg.self{border-left-color:var(--ok)}
.file{cursor:pointer;padding:8px 12px;border-radius:8px;display:flex;gap:8px;align-items:center}
.file:hover{background:var(--glow)}
pre.doc{background:var(--soft);border:1px solid var(--bd);border-radius:10px;padding:14px;white-space:pre-wrap;font-size:12.5px;line-height:1.7;max-height:60vh;overflow:auto}
.back{cursor:pointer;color:var(--primary);font-size:12px;margin-bottom:8px}
.empty{text-align:center;color:var(--td);padding:60px 0;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="logo">SV</div>
  <h1>服务台<small>服务型 agent 运行过程 · 项目群 · 配置</small></h1>
  <button class="btn" style="margin-left:auto" onclick="newAgent()">＋ 新建 agent</button>
  <span class="badge b-blue" id="sync">—</span>
</header>
<div class="tabs">
  <div class="tab on" data-t="services">服务</div>
  <div class="tab" data-t="projects">项目</div>
  <div class="tab" data-t="templates">项目模版</div>
</div>
<div class="wrap" id="main"></div>
<div id="drawer"><div class="dh"><b id="d-title">详情</b><button class="x" onclick="closeDrawer()">✕</button></div><div class="db" id="d-body"></div></div>
<script>
const $=s=>document.querySelector(s); const main=$('#main'); const db_=$('#d-body');
const esc=t=>(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
let TAB='services';
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');TAB=t.dataset.t;render();});
function closeDrawer(){$('#drawer').classList.remove('open')}
function openDrawer(title,html){$('#d-title').textContent=title;db_.innerHTML=html;$('#drawer').classList.add('open')}

async function jget(u){const r=await fetch(u);return r.json()}

/* ── 新建 agent（独立服务，不挂项目；加入项目走项目配置） ── */
async function newAgent(){
  const defs=await jget('/api/admin/defs');
  openDrawer('新建 agent',`
   <div class="kv"><i>名称</i><input id="na-name" placeholder="如：数据分析师" style="font-size:13px;border:1px solid var(--bd);border-radius:8px;padding:7px 10px;flex:1"></div>
   <div class="kv"><i>定义</i><select id="na-def" class="btn" style="font-size:13px;flex:1">${(defs.defs||[]).map(d=>`<option value="${d.def_id}">${esc(d.display_name)}</option>`).join('')}</select></div>
   <div class="hint">创建后为独立运行的服务 agent；要进项目，在客户页「项目配置 → 增加成员」里选它。</div>
   <button class="btn" style="background:#2563eb;color:#fff;border:none;margin-top:10px;padding:8px 18px" onclick="createAgent()">创建</button>`);
}
async function createAgent(){
  const name=document.getElementById('na-name').value.trim();
  const def=document.getElementById('na-def').value;
  if(!name){alert('名称必填');return;}
  const r=await fetch('/api/admin/agents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({def,name})});
  const d=await r.json();
  if(d.ok){closeDrawer();render();}else alert(d.error||'创建失败');
}

/* ── 项目模版编辑（结构化表单 + 源码模式） ── */
let TPL={mode:'form'};
async function tplEdit(tid){
  const [d,defs]=await Promise.all([jget('/api/admin/templates/'+tid),jget('/api/admin/defs')]);
  TPL={id:tid,p:d.parsed||{},defs:defs.defs||[],mode:'form'};
  openDrawer('模版 · '+tid,'<div id="tpl-body"></div>');
  renderTpl();
}
function renderTpl(){
  const el=document.getElementById('tpl-body');if(!el)return;
  const p=TPL.p;
  if(TPL.mode==='raw'){
    el.innerHTML=`<textarea id="tpl-raw" style="width:100%;min-height:56vh;font-family:ui-monospace,monospace;font-size:12px;line-height:1.7;border:1px solid var(--bd);border-radius:10px;padding:12px">${esc(TPL.raw||'')}</textarea>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn" style="background:#2563eb;color:#fff;border:none;padding:8px 18px" onclick="tplSaveRaw()">保存源码</button>
      <button class="btn" onclick="TPL.mode='form';renderTpl()">← 返回表单</button>
    </div>`;
    if(!TPL.raw)jget('/api/admin/templates/'+TPL.id).then(x=>{TPL.raw=x.raw;const t=document.getElementById('tpl-raw');if(t)t.value=x.raw;});
    return;
  }
  const roleNames=(p.roles||[]).map(r=>r.name||r.def);
  el.innerHTML=`
   <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
    <b style="font-size:13px">结构化编辑</b>
    <button class="btn" style="margin-left:auto" onclick="TPL.mode='raw';renderTpl()">源码模式</button>
   </div>
   <div class="kv"><i>模版名</i><input id="t-name" value="${esc(p.name||'')}" style="font-size:13px;border:1px solid var(--bd);border-radius:8px;padding:7px 10px;flex:1"></div>
   <div class="kv"><i>描述</i><input id="t-desc" value="${esc(p.description||'')}" style="font-size:13px;border:1px solid var(--bd);border-radius:8px;padding:7px 10px;flex:1"></div>
   <div class="kv"><i>看门狗</i><label style="font-size:12.5px"><input type="checkbox" id="t-wd" ${p.watchdog?'checked':''}> 全员停摆时自动催 PM</label></div>
   <div style="font-weight:600;margin:14px 0 6px">项目成员（${(p.roles||[]).length}）</div>
   ${(p.roles||[]).map((r,i)=>`<div style="border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px">
    <div style="display:flex;gap:6px;align-items:center">
     <input value="${esc(r.def||'')}" list="def-list" placeholder="定义" onchange="TPL.p.roles[${i}].def=this.value" style="font-size:12px;border:1px solid var(--bd);border-radius:7px;padding:5px 8px;width:180px;font-family:ui-monospace,monospace">
     <input value="${esc(r.name||'')}" placeholder="角色名" onchange="tplRoleRenamed(${i},this.value)" style="font-size:12.5px;border:1px solid var(--bd);border-radius:7px;padding:5px 8px;flex:1">
     <label style="font-size:12px;white-space:nowrap"><input type="radio" name="t-pm" ${r.pm?'checked':''} onchange="tplSetPm(${i})"> PM</label>
     <button class="btn" style="color:#c0353b;border-color:#e5b4b4" onclick="tplDelRole(${i})">删除</button>
    </div>
    <input value="${esc((r.tools||[]).join(', '))}" placeholder="工具面（逗号分隔，留空=默认全量）" onchange="TPL.p.roles[${i}].tools=this.value?this.value.split(',').map(x=>x.trim()).filter(Boolean):undefined" style="font-size:11.5px;border:1px solid var(--bd);border-radius:7px;padding:5px 8px;width:100%;margin-top:6px;font-family:ui-monospace,monospace">
   </div>`).join('')}
   <datalist id="def-list">${TPL.defs.map(d=>`<option value="${esc(d.def_id)}">${esc(d.display_name)}</option>`).join('')}</datalist>
   <button class="btn" onclick="tplAddRole()">＋ 增加成员</button>
   <div style="font-weight:600;margin:16px 0 6px">预设任务骨架（${(p.initial_todos||[]).length}）· 里程碑=特殊任务类型</div>
   ${(p.initial_todos||[]).map((t,i)=>`<div style="border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px">
    <div style="display:flex;gap:6px;align-items:center">
     <input value="${esc(t.title||'')}" placeholder="任务标题" onchange="TPL.p.initial_todos[${i}].title=this.value" style="font-size:12.5px;border:1px solid var(--bd);border-radius:7px;padding:5px 8px;flex:1">
     <select onchange="TPL.p.initial_todos[${i}].kind=this.value==='milestone'?'milestone':undefined" style="font-size:12px;border:1px solid var(--bd);border-radius:7px;padding:5px 6px">
      <option value="task" ${t.kind!=='milestone'?'selected':''}>任务</option>
      <option value="milestone" ${t.kind==='milestone'?'selected':''}>🚩 里程碑</option>
     </select>
     <button class="btn" style="color:#c0353b;border-color:#e5b4b4" onclick="tplDelTodo(${i})">删除</button>
    </div>
    <div style="display:flex;gap:6px;margin-top:6px">
     <input value="${esc(t.detail||'')}" placeholder="任务描述（可选）" onchange="TPL.p.initial_todos[${i}].detail=this.value" style="font-size:12px;border:1px solid var(--bd);border-radius:7px;padding:5px 8px;flex:1">
     <select onchange="TPL.p.initial_todos[${i}].assign_role=this.value||undefined" style="font-size:12px;border:1px solid var(--bd);border-radius:7px;padding:5px 6px;max-width:130px">
      <option value="">未指派</option>
      ${roleNames.map(n=>`<option value="${esc(n)}" ${t.assign_role===n?'selected':''}>${esc(n)}</option>`).join('')}
     </select>
    </div>
   </div>`).join('')}
   <button class="btn" onclick="tplAddTodo()">＋ 增加预设任务</button>
   <div style="display:flex;gap:8px;margin-top:14px">
    <button class="btn" style="background:#2563eb;color:#fff;border:none;padding:8px 18px" onclick="tplSaveStructured()">保存模版</button>
   </div>
   <div class="hint">建项目时按此骨架生成任务（指派按角色名解析到成员）；删成员会自动清掉引用它的任务指派。</div>`;
}
function tplAddRole(){TPL.p.roles=TPL.p.roles||[];TPL.p.roles.push({def:'',name:''});renderTpl();}
function tplDelRole(i){
  const name=(TPL.p.roles[i].name||TPL.p.roles[i].def||'').trim();
  TPL.p.roles.splice(i,1);
  // 联动：引用该角色的预设任务指派置空
  (TPL.p.initial_todos||[]).forEach(t=>{if((t.assign_role||'')===name)t.assign_role='';});
  renderTpl();
}
function tplRoleRenamed(i,v){
  const old=(TPL.p.roles[i].name||TPL.p.roles[i].def||'').trim();
  TPL.p.roles[i].name=v;
  (TPL.p.initial_todos||[]).forEach(t=>{if((t.assign_role||'')===old)t.assign_role=v;});
}
function tplSetPm(i){(TPL.p.roles||[]).forEach((r,j)=>r.pm=(j===i));renderTpl();}
function tplAddTodo(){TPL.p.initial_todos=TPL.p.initial_todos||[];TPL.p.initial_todos.push({title:''});renderTpl();}
function tplDelTodo(i){TPL.p.initial_todos.splice(i,1);renderTpl();}
async function tplSaveStructured(){
  collectTplHead();
  const r=await fetch('/api/admin/templates/'+TPL.id+'/structured',{method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({template:TPL.p})});
  const d=await r.json();
  if(d.ok){TPL.raw=d.raw;alert('已保存（建项目即时生效）');render();}
  else alert(d.error||'保存失败');
}
function collectTplHead(){
  TPL.p.name=document.getElementById('t-name').value.trim();
  TPL.p.description=document.getElementById('t-desc').value.trim();
  TPL.p.watchdog=document.getElementById('t-wd').checked;
}
async function tplSaveRaw(){
  const raw=document.getElementById('tpl-raw').value;
  const r=await fetch('/api/admin/templates/'+TPL.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({raw})});
  const d=await r.json();
  if(d.ok){alert('已保存');render();}else alert(d.error||'失败');
}

async function render(){
  $('#sync').textContent='加载中…';
  if(TAB==='services'){
    const d=await jget('/api/admin/services');
    if(!d.services.length){main.innerHTML='<div class="empty">暂无服务——到 <a href="/customer" target="_blank">客户入口</a> 发起一单</div>';$('#sync').textContent='就绪';return;}
    main.innerHTML=`<table><tr><th>角色</th><th>服务 ID</th><th>定义</th><th>项目</th><th>状态</th><th>唤醒</th><th>最近唤醒</th><th>积压</th><th>消息</th><th>订阅</th><th>操作</th></tr>`+
    d.services.map(s=>`<tr>
      <td><b>${esc(s.role)}</b></td>
      <td class="mono">${s.service_id.slice(0,14)}…</td>
      <td class="mono">${esc(s.agent_def_id.replace('consulting-','').replace('-def',''))}</td>
      <td>${esc(s.project_name||'—')}</td>
      <td><span class="badge ${s.status==='active'?'b-green':'b-gray'}">${s.status==='active'?'运行':'归档'}</span></td>
      <td>${s.wakes}</td><td class="mono">${s.last_wake_at||'—'}</td>
      <td>${s.open_events?`<span class="badge b-amber">${s.open_events}</span>`:'0'}</td>
      <td>${s.messages}</td>
      <td class="mono" style="max-width:140px">${(s.subscriptions||[]).join(',')}</td>
      <td><button class="btn" onclick="detail('${s.service_id}')">明细</button>
      <button class="btn" onclick="toggle('${s.service_id}','${s.status==='active'?'archived':'active'}')">${s.status==='active'?'归档':'恢复'}</button></td>
    </tr>`).join('')+`</table><div class="hint">点「明细」看该服务的唤醒记录与运行统计</div>`;
  } else if(TAB==='projects'){
    const d=await jget('/api/admin/projects');
    if(!d.projects.length){main.innerHTML='<div class="empty">暂无项目</div>';$('#sync').textContent='就绪';return;}
    main.innerHTML=`<table><tr><th>项目</th><th>进度</th><th>PM</th><th>成员</th><th>待办</th><th>客户</th><th>看门狗</th><th>创建</th><th>操作</th></tr>`+
    d.projects.map(p=>`<tr>
      <td><b>${esc(p.name)}</b></td>
      <td><span class="badge ${p.status==='active'?'b-green':'b-gray'}">${p.status==='active'?'运行中':'已归档'}</span></td>
      <td class="mono">${esc((p.members[0]||'').slice(0,8))}</td>
      <td>${p.members.map(m=>esc(m)).join('、')}</td>
      <td>${p.todos_done}/${p.todos_total}</<td>
      <td class="mono">${esc(p.customer_id||'—')}</td>
      <td>${p.watchdog?'<span class="badge b-amber">on</span>':'—'}</td>
      <td class="mono">${p.created_at}</td>
      <td><button class="btn" onclick="group('${p.project_id}','${esc(p.name)}')">群沟通</button>
      <button class="btn" onclick="files('${p.project_id}','')">交付物</button>
      <button class="btn" onclick="projCfg('${p.project_id}','${esc(p.name)}')">配置</button></td>
    </tr>`).join('')+`</table><div class="hint">群沟通=项目内服务间的协作直播 · 交付物=共享区文件</div>`;
  } else if(TAB==='templates'){
    const d=await jget('/api/admin/templates');
    if(!d.templates.length){main.innerHTML='<div class="empty">暂无模版</div>';$('#sync').textContent='就绪';return;}
    main.innerHTML=`<table><tr><th>模版 ID</th><th>名称</th><th>大小</th><th>操作</th></tr>`+
    d.templates.map(t=>`<tr>
      <td class="mono">${esc(t.id)}</td><td><b>${esc(t.name)}</b></td>
      <td>${(t.size/1000).toFixed(1)} KB</td>
      <td><button class="btn" onclick="tplEdit('${esc(t.id)}')">编辑</button></td>
    </tr>`).join('')+`</table><div class="hint">模版即建项目时的角色/工具面/初始待办定义（config/project_templates/*.yaml）；保存前过 YAML 语法闸</div>`;
  }
  $('#sync').textContent='就绪';
}

async function detail(sid){
  const d=await jget('/api/admin/services/'+sid);
  const s=d.service;
  openDrawer(s.role+' · 明细',`
    <div class="kv"><i>服务 ID</i><span class="mono">${s.service_id}</span></div>
    <div class="kv"><i>定义</i><span class="mono">${esc(s.agent_def_id)}</span></div>
    <div class="kv"><i>状态</i>${s.status}</div>
    <div class="kv"><i>订阅</i><span class="mono">${(s.subscriptions||[]).join(', ')}</span></div>
    <div class="kv"><i>工具面</i><span class="mono">${s.tools?esc(s.tools.join(', ')):'默认全量'}</span></div>
    <div class="kv"><i>capabilities</i><span class="mono">${esc(JSON.stringify(s.capabilities||{}))}</span></div>
    <div class="kv"><i>统计</i>唤醒 ${s.wakes} · 消息 ${s.messages} · 积压 ${s.open_events}</div>
    <div style="margin:14px 0 8px;font-weight:600">最近唤醒（新→旧）</div>
    ${d.wakes.map(w=>`<div class="wake"><b>#${w.seq} ${esc(w.reason||'')}</b><div class="m">${esc(w.started_at||'')} · ${esc(w.session_id)} ${w.tokens?'· '+w.tokens+' tok':''}</div></div>`).join('')||'<div class="empty">无唤醒记录</div>'}
  `);
}
async function toggle(sid,status){await fetch(`/api/admin/services/${sid}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});render()}
/* ── 项目/agent 配置 ── */
const ALL_TOOLS=['sense_project_peers','send_chat_message','project_file_list','project_file_read','project_file_write','deliver_to_shared','project_todo_create','project_todo_list','project_todo_update'];
const ALL_SUBS=['message','group_message','timer','project_stall'];
const ALL_CAPS=['vitals','routines','perception','projects'];
async function projCfg(pid,name){
  const [projList,defs,svcs]=await Promise.all([
    jget('/api/admin/projects'), jget('/api/admin/defs'), jget('/api/admin/services')]);
  const proj=projList.projects.find(x=>x.project_id===pid);
  const members=(svcs.services||[]).filter(s=>s.project_id===pid);
  openDrawer(name+' · 项目配置',`
   <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
     <span class="badge ${proj&&proj.watchdog?'b-amber':'b-gray'}">看门狗 ${proj&&proj.watchdog?'开':'关'}</span>
     <button class="btn" onclick="toggleWd('${pid}')">${proj&&proj.watchdog?'关闭':'开启'}</button>
     <span style="font-size:12px;color:var(--td)">有未完成待办但全员停摆时，自动提醒项目经理</span>
   </div>
   <div style="font-weight:600;margin:14px 0 6px">成员（${members.length}）· 点配置可调角色/工具/订阅</div>
   ${members.map(s=>`
   <div style="border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px">
    <div style="display:flex;align-items:center;gap:8px">
      <b>${esc(s.role)}</b>
      <span class="mono" style="color:var(--td);font-size:11px">${esc(s.agent_def_id.replace('consulting-','').replace('-def',''))}</span>
      <span class="badge ${s.status==='active'?'b-green':'b-gray'}">${s.status==='active'?'运行':'归档'}</span>
      <span style="font-size:11px;color:var(--td)">唤醒 ${s.wakes} · 消息 ${s.messages}</span>
      <button class="btn" style="margin-left:auto" onclick="svcCfg('${s.service_id}')">配置</button>
    </div>
   </div>`).join('')||'<div class="empty">无成员</div>'}
   <div style="font-weight:600;margin:16px 0 6px">增加成员</div>
   <div style="display:flex;gap:8px">
     <input id="add-role" placeholder="角色名，如：数据分析师" style="flex:1;font-size:13px;border:1px solid var(--bd);border-radius:8px;padding:8px 10px">
     <select id="add-def" class="btn" style="font-size:13px">${(defs.defs||[]).map(d=>`<option value="${d.def_id}">${esc(d.display_name)}</option>`).join('')}</select>
     <button class="btn" style="background:#2563eb;color:#fff;border:none" onclick="addMember('${pid}')">加入项目</button>
   </div>`);
}

async function svcCfg(sid){
  const d=await jget('/api/admin/services/'+sid);
  const s=d.service;
  const chk=(list,all)=>all.map(x=>`<label style="display:inline-flex;gap:5px;align-items:center;margin:2px 8px 2px 0;font-size:12.5px"><input type="checkbox" value="${x}" ${(list||[]).includes(x)?'checked':''}>${x}</label>`).join('');
  openDrawer(s.role+' · agent 配置',`
   <div class="kv"><i>角色名</i><input id="cfg-name" value="${esc(s.role)}" style="font-size:13px;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;flex:1"></div>
   <div class="kv"><i>定义</i><span class="mono">${esc(s.agent_def_id)}</span></div>
   <div style="font-weight:600;margin:12px 0 4px">事件订阅</div><div>${chk(s.subscriptions,ALL_SUBS)}</div>
   <div style="font-weight:600;margin:12px 0 4px">工具面 ${s.tools?'（按模版收紧）':'（默认全量）'}</div><div>${chk(s.tools||ALL_TOOLS,ALL_TOOLS)}</div>
   <div style="font-weight:600;margin:12px 0 4px">能力开关</div><div>${ALL_CAPS.map(c=>`<label style="display:inline-flex;gap:5px;margin:2px 10px 2px 0;font-size:12.5px"><input type="checkbox" data-cap="${c}" ${((s.capabilities||{})[c]===true)?'checked':''}>${c}</label>`).join('')}</div>
   <button class="btn" style="margin-top:14px;background:#2563eb;color:#fff;border:none;padding:8px 18px" onclick="saveCfg('${sid}')">保存配置</button>`);
}
async function saveCfg(sid){
  const subs=[...document.querySelectorAll('.drawer input[type=checkbox]:not([data-cap])')].filter(c=>c.closest('div')&&c.closest('div').previousElementSibling===null);
  // 简化：按区域收集
  const boxes=[...document.querySelectorAll('#d-body input[type=checkbox]')];
  const caps={};boxes.filter(b=>b.dataset.cap).forEach(b=>caps[b.dataset.cap]=b.checked);
  const checkedTools=boxes.filter(b=>!b.dataset.cap&&ALL_TOOLS.includes(b.value)).map(b=>b.value);
  const checkedSubs=boxes.filter(b=>!b.dataset.cap&&ALL_SUBS.includes(b.value)).map(b=>b.value);
  await fetch(`/api/admin/services/${sid}/config`,{method:'PATCH',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({display_name:document.getElementById('cfg-name').value,
      subscriptions:checkedSubs,tools:checkedTools,capabilities:caps})});
  alert('已保存（工具面/订阅/能力即时生效于下次唤醒）');
}
async function toggleWd(pid){
  const d=await jget('/api/admin/projects');const pr=d.projects.find(x=>x.project_id===pid);
  await fetch(`/api/admin/projects/${pid}/watchdog`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!pr.watchdog})});
  projCfg(pid,pr.name);
}
async function addMember(pid){
  const role=document.getElementById('add-role').value.trim();
  const def=document.getElementById('add-def').value;
  if(!role){alert('角色名必填');return;}
  const r=await fetch(`/api/admin/projects/${pid}/members`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({def,role})});
  const d=await r.json();
  if(d.ok){const pl=await jget('/api/admin/projects');projCfg(pid,pl.projects.find(x=>x.project_id===pid).name);}else alert(d.error);
}

async function group(pid,name){
  const d=await jget(`/api/admin/projects/${pid}/group`);
  openDrawer(name+' · 群沟通',d.messages.map(m=>`
    <div class="msg ${m.from==='self'?'self':''}"><div class="m">${esc(m.sender_name)} · ${esc(m.ts)}</div>${esc(m.text)}</div>`).join('')||'<div class="empty">暂无群消息</div>');
}
async function files(pid,path){
  const d=await jget(`/api/admin/projects/${pid}/files?path=${encodeURIComponent(path)}`);
  if(d.kind==='dir'){
    openDrawer('交付物 · '+(path||'shared/'),(path?`<div class="back" onclick="files('${pid}','${path.split('/').slice(0,-1).join('/')}')">‥ 上级</div>`:'')+
      d.entries.map(e=>e.type==='dir'
        ?`<div class="file" onclick="files('${pid}','${e.rel}')">📂 <b>${esc(e.name)}</b>/</div>`
        :`<div class="file" onclick="files('${pid}','${e.rel}')">📄 ${esc(e.name)} <span style="margin-left:auto;color:var(--td)">${(e.size/1000).toFixed(1)}k</span></div>`).join('')||'<div class="empty">空</div>');
  } else {
    openDrawer('📄 '+path,`<div class="back" onclick="files('${pid}','${path.split('/').slice(0,-1).join('/')}')">‥ 上级</div><pre class="doc">${esc(d.content)}</pre>`);
  }
}
render(); setInterval(render, 15000);
// 从客户页「编辑项目模版」跳入：#tpl={id} 自动切 tab 并打开编辑器
if(location.hash.startsWith('#tpl=')){
  const _tid=decodeURIComponent(location.hash.slice(5));
  history.replaceState(null,'','#services');
  const _t=document.querySelector('.tab[data-t=\'templates\']');
  if(_t)_t.click();
  tplEdit(_tid);
}
</script>
</body>
